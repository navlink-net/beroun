<meta charset="utf-8">
<title>Books</title>
<meta name="viewport" content="width=640,height=480">
<!--
  Books: the FB2 books of squirrelwisdom.com (the public catalog and the owner's own), read on the device; booksd (manifest: services) downloads, parses and keeps them.
  The library: Left / Right change the tab (Reading, Public, My books), Up / Down choose, A opens (on the first row: search), B leaves.
  The reader: Left / Right turn the page, Up / Down go to the previous / next chapter, A opens the menu (contents, search, font, light or dark), B goes back to the library.
  The place is kept as chapter and paragraph, so a change of the font size does not lose it. Only the cursor, A and B have a job.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #tabs { flex: none; display: flex; background: #000; }
  .tab { flex: 1; text-align: center; padding: 9px 0; font-size: 18px; color: #8a949e; border-bottom: 3px solid transparent; }
  .tab.on { color: #f2a900; border-color: #f2a900; }
  #list { flex: 1; min-height: 0; overflow: hidden; padding: 6px 10px; position: relative; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 4px 10px; margin-bottom: 4px; border-radius: 6px; background: #1d242b; font-size: 19px; }
  .row.sel { background: #f2a900; color: #000; }
  .row .ic { flex: none; width: 22px; text-align: center; }
  .row .x { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .x small { display: block; font-size: 13px; opacity: .65; overflow: hidden; text-overflow: ellipsis; }
  .row .d { flex: none; font-size: 13px; opacity: .8; }
  .row.act { background: #26303a; }
  .row.act.sel { background: #f2a900; }
  .empty { padding: 30px; text-align: center; color: #6c7780; font-size: 18px; }
  #foot { flex: none; height: 24px; line-height: 24px; padding: 0 14px; background: #1d242b; color: #aab; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msg { flex: none; display: none; padding: 6px 14px; background: #3a2a00; color: #f2a900; font-size: 15px; }
  #ask { display: none; flex: none; padding: 8px 12px; background: #000; border-top: 2px solid #f2a900; }
  #ask label { display: block; font-size: 14px; color: #8a949e; margin-bottom: 4px; }
  #ask input { width: 100%; padding: 8px 10px; font-size: 20px; background: #1d242b; color: #fff; border: 1px solid #f2a900; border-radius: 5px; outline: 0; }
  #menu { position: absolute; right: 16px; top: 8px; min-width: 240px; max-width: 90%; background: #000; border: 2px solid #f2a900; border-radius: 8px; padding: 6px; z-index: 5; }
  #menu div { padding: 9px 12px; font-size: 19px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu div.sel { background: #f2a900; color: #000; }
  /* the reader */
  #reader { display: none; flex: 1; min-height: 0; flex-direction: column; background: var(--bg); color: var(--fg); position: relative; }
  #rhead { flex: none; height: 26px; line-height: 26px; padding: 0 14px; font-size: 13px; background: var(--bar); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 10px; }
  #rhead span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #page { flex: 1; min-height: 0; overflow: hidden; position: relative; padding: 0 16px; }
  #cols { height: 100%; overflow: hidden; column-gap: 0; column-fill: auto; }
  #cols p { margin: 0 0 .55em; text-align: left; line-height: 1.38; }
  #cols h3 { margin: .3em 0 .5em; font-size: 1.1em; color: var(--head); }
  #cols .ch { font-size: 1.15em; font-weight: bold; color: var(--head); margin: 0 0 .7em; }
  #cols .v { margin: 0 0 .15em 1.2em; }
  #cols .q { margin: 0 0 .55em 1.2em; font-style: italic; opacity: .85; }
  #cols .e { height: .8em; }
  #reader.dark { --bg: #111; --fg: #ddd; --bar: #000; --dim: #8a949e; --head: #f2a900; }
  #reader.light { --bg: #f4efe4; --fg: #222; --bar: #e6dfcf; --dim: #6b6558; --head: #8a5a00; }
</style>
<div id="tabs"></div>
<div id="list"></div>
<div id="reader" class="dark"><div id="rhead"><span id="rtitle"></span><span id="rpos"></span></div><div id="page"><div id="cols"></div></div></div>
<div id="msg"></div>
<div id="ask"><label id="askLabel"></label><input id="askIn" type="text" autocomplete="off"></div>
<div id="foot"></div>
<script src="/platform.js"></script>
<script>
  const API = '/api/app/books/';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const T = s => Platform.t(s);
  const TABS = ['reading', 'public', 'mine'];
  const SIZES = [18, 22, 26, 30];

  let tab = 'public', filter = {q: '', language: ''}, books = [], langs = [];
  let rows = [], sel = 0;
  let mode = 'list';                       // list | read
  let menu = null;                         // {i, items: [{label, run}]}
  let picker = null;                       // {title, items: [{label, value}], i, done}
  let ask = null;
  let prefs = {size: 22, theme: 'dark'};
  let cur = null;                          // the open book {scope, id, title, chapters: [{title, blocks}], total}
  let ch = 0, blocks = [], page = 0, pages = 1, bl = 0;   // chapter, its blocks, page, page count, the block at the top of the page
  let saveTimer = null;

  async function api(path, body) {
    const r = await fetch(API + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.kind = j.kind; throw e; }
    return j;
  }
  function say(text) { const m = $('msg'); m.textContent = text || ''; m.style.display = text ? 'block' : 'none'; }
  function failText(e) {
    return e.kind === 'network' ? T('No network, and the book is not on the device')
      : e.kind === 'signin' ? T('Sign in to the console to see your books')
      : e.kind === 'config' ? T('Books are not set up') : (e.message || T('Something went wrong'));
  }

  // ---- the library -------------------------------------------------------------------------------
  async function load() {
    say('');
    try {
      if (tab === 'reading') {
        books = (await api('recent')).books.map(b => ({...b, description: ''}));
      } else {
        const q = new URLSearchParams({scope: tab, q: filter.q, language: filter.language});
        const r = await api('catalog?' + q);
        books = r.books; langs = r.languages;
        if (!r.signedIn) say(failText({kind: 'signin'}));
        else if (r.stale) say(T('Offline: the list is from the last time'));
      }
    } catch (e) { books = []; say(failText(e)); }
    rows = [];
    if (tab !== 'reading') {
      rows.push({kind: 'search'});
      if (langs.length > 1) rows.push({kind: 'lang'});
    }
    rows = rows.concat(books.map(b => ({kind: 'book', b})));
    sel = Math.min(sel, Math.max(0, rows.length - 1));
  }

  function draw() {
    const reading = mode === 'read';
    $('tabs').style.display = reading ? 'none' : 'flex';
    $('list').style.display = reading ? 'none' : 'block';
    $('reader').style.display = reading ? 'flex' : 'none';
    $('ask').style.display = ask ? 'block' : 'none';
    if (!reading) {
      $('tabs').innerHTML = TABS.map(t => `<div class="tab${t === tab ? ' on' : ''}">${T(t === 'reading' ? 'Reading' : t === 'public' ? 'Public' : 'My books')}</div>`).join('');
      let h = rows.map((r, i) => {
        const on = i === sel ? ' sel' : '';
        if (r.kind === 'search') return `<div class="row act${on}"><span class="ic">?</span><span class="x">${filter.q ? esc(filter.q) + ' — ' + T('change the search') : T('Search by title or author')}</span></div>`;
        if (r.kind === 'lang') return `<div class="row act${on}"><span class="ic">◐</span><span class="x">${T('Language')}: ${esc(filter.language || T('all'))}</span></div>`;
        const b = r.b;
        return `<div class="row${on}"><span class="ic">${b.downloaded ? '●' : '○'}</span><span class="x">${esc(b.title)}<small>${esc(b.author)}</small></span><span class="d">${b.read ? Math.round(b.read.pct) + '%' : b.pct ? Math.round(b.pct) + '%' : ''}</span></div>`;
      }).join('');
      if (!books.length) h += `<div class="empty">${tab === 'reading' ? T('Nothing read yet: pick a book in the Public tab') : T('No books')}</div>`;
      if (picker) {
        h = `<div class="empty" style="padding:6px">${esc(picker.title)}</div>` + picker.items.map((p, i) => `<div class="row${i === picker.i ? ' sel' : ''}"><span class="x">${esc(p.label)}</span></div>`).join('');
      }
      $('list').innerHTML = h;
      const s = $('list').querySelector('.row.sel');
      if (s) s.scrollIntoView({block: 'nearest'});
    } else if (menu) {
      const m = $('menu') || Object.assign(document.createElement('div'), {id: 'menu'});
      m.innerHTML = menu.items.map((x, i) => `<div class="${i === menu.i ? 'sel' : ''}">${esc(x.label)}</div>`).join('');
      if (!m.isConnected) $('reader').appendChild(m);
    } else if ($('menu')) $('menu').remove();
    $('foot').textContent = picker ? T('A: choose · B: cancel') : reading ? (menu ? T('A: choose · B: close') : T('A: menu · Left/Right: page · B: library')) : T('A: open · Left/Right: tab · B: leave');
  }

  // ---- asking for a line of text -----------------------------------------------------------------
  function prompt(label, value) {
    return new Promise(res => { ask = {done: res}; $('askLabel').textContent = label; $('askIn').value = value || ''; draw(); $('askIn').focus(); });
  }
  function closeAsk(v) { const a = ask; ask = null; $('askIn').blur(); draw(); a.done(v); }
  $('askIn').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); closeAsk($('askIn').value.trim()); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAsk(null); }
  });
  function choose(title, items, start) { return new Promise(res => { picker = {title, items, i: start || 0, done: res}; draw(); }); }

  // ---- the reader --------------------------------------------------------------------------------
  const colsW = () => $('page').clientWidth - 32;

  function layout(keepBlock) {
    const c = $('cols'), w = colsW();
    c.style.width = w + 'px';
    c.style.columnWidth = w + 'px';
    c.style.fontSize = prefs.size + 'px';
    pages = Math.max(1, Math.ceil(c.scrollWidth / w - 0.01));
    if (keepBlock !== undefined) page = pageOfBlock(keepBlock);
    page = Math.max(0, Math.min(pages - 1, page));
    c.scrollLeft = page * w;
    bl = topBlock();
    head();
  }

  function pageOfBlock(i) {
    const el = $('cols').querySelector(`[data-b="${i}"]`);
    if (!el) return 0;
    const r = el.getClientRects()[0], base = $('cols').getBoundingClientRect().left;
    return Math.max(0, Math.floor(((r ? r.left : base) - base + $('cols').scrollLeft + 2) / colsW()));
  }

  function topBlock() {
    const base = $('cols').getBoundingClientRect().left, w = colsW();
    for (const el of $('cols').querySelectorAll('[data-b]')) {
      const r = el.getClientRects();
      for (const q of r) if (q.right - base > 4 && q.left - base >= -2 && q.left - base < w - 4) return Number(el.dataset.b);
      if (r.length && r[0].left - base >= w) break;
    }
    return 0;
  }

  function render(chapter) {
    $('cols').innerHTML = `<div class="ch">${esc(chapter.title)}</div>` + chapter.blocks.map((b, i) => {
      const x = esc(b.x);
      return b.t === 'h' ? `<h3 data-b="${i}">${x}</h3>` : b.t === 'v' ? `<p class="v" data-b="${i}">${x}</p>` : b.t === 'q' ? `<p class="q" data-b="${i}">${x}</p>`
        : b.t === 'e' ? `<div class="e" data-b="${i}"></div>` : `<p data-b="${i}">${x}</p>`;
    }).join('');
  }

  function pct() {
    if (!cur) return 0;
    let before = 0;
    for (let i = 0; i < ch; i++) before += cur.chapters[i].blocks;
    return Math.min(100, (before + bl) / Math.max(1, cur.total) * 100);
  }

  function head() {
    $('rtitle').textContent = cur ? cur.title : '';
    $('rpos').textContent = cur ? `${ch + 1}/${cur.chapters.length} · ${page + 1}/${pages} · ${Math.round(pct())}%` : '';
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 600);
  }
  function saveNow() {
    clearTimeout(saveTimer);
    if (!cur) return Promise.resolve();
    return api('progress', {scope: cur.scope, id: cur.id, chapter: ch, block: bl, pct: pct()}).catch(() => {});
  }

  async function showChapter(n, atBlock, last) {
    const t = await api(`text?scope=${cur.scope}&id=${encodeURIComponent(cur.id)}&chapter=${n}`);
    ch = n; blocks = t.blocks;
    render(t);
    page = 0;
    layout(atBlock || 0);
    if (last) { page = pages - 1; layout(); }
    scheduleSave(); draw();
  }

  async function turn(d) {
    if (d > 0 && page < pages - 1) { page++; $('cols').scrollLeft = page * colsW(); bl = topBlock(); head(); scheduleSave(); return; }
    if (d < 0 && page > 0) { page--; $('cols').scrollLeft = page * colsW(); bl = topBlock(); head(); scheduleSave(); return; }
    if (d > 0 && ch < cur.chapters.length - 1) return showChapter(ch + 1, 0);
    if (d < 0 && ch > 0) return showChapter(ch - 1, 0, true);
  }

  async function openBook(scope, id) {
    say(T('Opening…'));
    try {
      const b = await api(`book?scope=${scope}&id=${encodeURIComponent(id)}`);
      cur = {scope, id: b.id, title: b.title, author: b.author, chapters: b.chapters, total: b.chapters.reduce((s, c) => s + c.blocks, 0)};
      mode = 'read'; menu = null; say('');
      $('reader').className = prefs.theme;
      draw();
      const r = b.read || {chapter: 0, block: 0};
      await showChapter(Math.min(r.chapter || 0, b.chapters.length - 1), r.block || 0);
    } catch (e) { cur = null; mode = 'list'; say(failText(e)); draw(); }
  }

  async function closeBook() {
    await saveNow(); cur = null; menu = null; mode = 'list';
    await load(); draw();
  }

  function readerMenu() {
    menu = {i: 0, items: [
      {label: T('Contents'), run: async () => {
        const v = await choose(T('Contents'), cur.chapters.map((c, i) => ({label: c.title, value: i})), ch);
        if (v) await showChapter(v.value, 0);
      }},
      {label: T('Search in the book'), run: async () => {
        const q = await prompt(T('Search in the book'), '');
        if (!q) return;
        const r = await api(`find?scope=${cur.scope}&id=${encodeURIComponent(cur.id)}&q=${encodeURIComponent(q)}`);
        if (!r.matches.length) { say(T('Nothing found')); setTimeout(() => say(''), 2000); return; }
        const v = await choose(T('Found'), r.matches.map(m => ({label: `${m.chapter + 1}: ${m.text}`, value: m})));
        if (v) await showChapter(v.value.chapter, v.value.block);
      }},
      {label: T('Font size') + ': ' + prefs.size, run: async () => { prefs.size = SIZES[(SIZES.indexOf(prefs.size) + 1) % SIZES.length]; savePrefs(); layout(bl); scheduleSave(); }},
      {label: prefs.theme === 'dark' ? T('Light page') : T('Dark page'), run: async () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; $('reader').className = prefs.theme; savePrefs(); }},
      {label: T('Library'), run: closeBook}]};
    draw();
  }
  function savePrefs() { Platform.db.set('prefs', JSON.stringify(prefs)).catch(() => {}); }

  // ---- keys --------------------------------------------------------------------------------------
  async function activate(r) {
    if (r.kind === 'book') return openBook(r.b.scope, r.b.id);
    if (r.kind === 'search') {
      const q = await prompt(T('Search by title or author'), filter.q);
      if (q !== null) { filter.q = q; sel = 0; await load(); }
    } else if (r.kind === 'lang') {
      const all = [''].concat(langs);
      filter.language = all[(all.indexOf(filter.language) + 1) % all.length]; await load();
    }
  }

  addEventListener('keydown', async e => {
    if (ask) return;
    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) return;
    e.preventDefault();
    try {
      if (picker) {
        if (e.key === 'ArrowUp') picker.i = Math.max(0, picker.i - 1);
        else if (e.key === 'ArrowDown') picker.i = Math.min(picker.items.length - 1, picker.i + 1);
        else if (e.key === 'Enter' || e.key === 'Escape') { const p = picker; picker = null; p.done(e.key === 'Enter' ? p.items[p.i] : null); }
      } else if (mode === 'read') {
        if (menu) {
          if (e.key === 'ArrowUp') menu.i = Math.max(0, menu.i - 1);
          else if (e.key === 'ArrowDown') menu.i = Math.min(menu.items.length - 1, menu.i + 1);
          else if (e.key === 'Escape' || e.key === 'ArrowLeft') menu = null;
          else if (e.key === 'Enter') { const m = menu.items[menu.i]; menu = null; draw(); await m.run(); }
        } else if (e.key === 'ArrowRight') await turn(1);
        else if (e.key === 'ArrowLeft') await turn(-1);
        else if (e.key === 'ArrowDown' && ch < cur.chapters.length - 1) await showChapter(ch + 1, 0);
        else if (e.key === 'ArrowUp' && ch > 0) await showChapter(ch - 1, 0);
        else if (e.key === 'Enter') readerMenu();
        else if (e.key === 'Escape') return closeBook();
      } else {
        if (e.key === 'ArrowUp') sel = Math.max(0, sel - 1);
        else if (e.key === 'ArrowDown') sel = Math.min(rows.length - 1, sel + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          tab = TABS[(TABS.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length]; sel = 0; filter = {q: '', language: ''}; await load();
        } else if (e.key === 'Enter' && rows[sel]) await activate(rows[sel]);
        else if (e.key === 'Escape') { await Platform.state.set({}).catch(() => {}); return Platform.exit(); }
      }
    } catch (err) { console.error(err); say(failText(err)); }
    draw();
  });

  $('list').addEventListener('click', async e => {
    const el = e.target.closest('.row'); if (!el || picker || mode !== 'list') return;
    const i = [...$('list').querySelectorAll('.row')].indexOf(el);
    if (i < 0 || !rows[i]) return;
    sel = i; draw(); await activate(rows[i]).catch(err => say(failText(err))); draw();
  });

  Platform.onClose(async () => {
    await saveNow();
    await Platform.state.set(cur ? {scope: cur.scope, id: cur.id} : {tab}).catch(() => {});
  });

  // Caroline's tools for this page (manifest: "caroline")
  Platform.tools.handle('open_book', async a => { if (mode === 'read') await closeBook(); await openBook(a.scope === 'mine' ? 'mine' : 'public', String(a.id)); return cur ? `open: ${cur.title}` : 'could not open the book'; });
  Platform.tools.handle('where_am_i', async () => cur ? `${cur.title} — ${cur.author}; chapter ${ch + 1} of ${cur.chapters.length} (${cur.chapters[ch].title}), ${Math.round(pct())}%` : 'no book is open');
  Platform.tools.handle('page_text', async () => cur ? [...$('cols').querySelectorAll('[data-b]')].filter(el => { const r = el.getClientRects()[0], b = $('cols').getBoundingClientRect().left; return r && r.left - b >= -2 && r.left - b < colsW(); }).map(el => el.textContent).join('\n') : 'no book is open');

  addEventListener('resize', () => { if (mode === 'read') layout(bl); });

  (async () => {
    let p = await Platform.db.get('prefs').catch(() => null);
    try { p = typeof p === 'string' ? JSON.parse(p) : p; } catch (e) { p = null; }
    if (p && SIZES.includes(p.size)) prefs = {size: p.size, theme: p.theme === 'light' ? 'light' : 'dark'};
    const st = await Platform.state.get().catch(() => null);
    const arg = await Platform.launchArg().catch(() => null);
    if (st && TABS.includes(st.tab)) tab = st.tab;
    else { const rc = await api('recent').catch(() => ({books: []})); if (rc.books.length) tab = 'reading'; }
    await load(); draw();
    if (arg && arg.id) await openBook(arg.scope === 'mine' ? 'mine' : 'public', String(arg.id));
    else if (st && st.id) await openBook(st.scope === 'mine' ? 'mine' : 'public', String(st.id));
  })();

  addEventListener('osk', () => {});
</script>
