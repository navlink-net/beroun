<meta charset="utf-8">
<title>Browser</title>
<!--
  The browser's own UI, shown by ic-browser (native/browser) over the pages: a 40 px strip with the address and a kebab menu,
  the menu with the tabs, and (from platform.js) the on-screen keyboard. The page is transparent: the host puts it over
  the content. It talks to the host with window.webkit.messageHandlers.host.postMessage("command"):
    nav:<address> | back | fwd | reload | sync | newtab | close:<i> | switch:<i> | capture:0|1 | detach | restore:<active>|<url>\t<scroll>\n<url>... | osk:<script> | ready
  and gets window.ic.state({tabs:[{title,uri,scroll}], home, active, max, back, fwd, loading}) in return.
  capture:1 means "send all input here" (menu or keyboard open, or the remote). No device buttons are assigned here: touch and mouse only (and the cursor and A in the remote).
  The tabs (and where each page is scrolled to) are kept in the launcher database (Platform.db, key "session") and come back at the next start.
  The EXTERNAL SCREEN (docs/system-api.md; the owner's rule): with an external monitor plugged in, the page is on it, by itself (at the start, or when it is plugged in). The tabs
  go to big.html (the second ic-browser, the page alone on the big screen: open(arg) with the session), this host lets go of them (detach), and this page becomes the REMOTE: the address with
  the keyboard, back / forward / reload, the tabs, the bookmarks (Platform.db "bookmarks"). The two talk by Platform.display messages ({cmd} one way, {state} the other). When the monitor
  is unplugged the tabs come back here.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: #fff;
               font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  #strip { position: fixed; left: 0; top: 0; right: 0; height: 40px; background: #000; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 6px; }
  #url { flex: 1; min-width: 0; height: 30px; border: 0; border-radius: 15px; padding: 0 14px; background: #2d3640; color: #fff; font: 16px "DejaVu Sans", sans-serif; outline: 0; }
  #url:focus { background: #fff; color: #000; }
  #url, #rurl { padding-inline-end: 38px; }
  /* the ✕ inside the end of an address field (shown when there is something in it): clears it */
  .clr { flex: none; position: relative; width: 28px; height: 28px; margin-inline-start: -40px; margin-inline-end: 6px; padding: 0; border: 0; border-radius: 14px;
         background: #56616c; color: #fff; font-size: 14px; display: none; align-items: center; justify-content: center; }
  #kebab { flex: none; width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  #kebab i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
  #bar { position: fixed; left: 0; top: 38px; height: 2px; width: 0; background: #f2a900; transition: width .2s; }
  #shade { position: fixed; left: 0; right: 0; top: 40px; bottom: 0; display: none; }
  #menu { position: fixed; inset-inline-end: 0; top: 40px; width: 420px; max-width: 100%; background: #1d242b; display: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
  .row { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 18px; border-bottom: 1px solid #2a323a; }
  .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.cur .t { color: #f2a900; font-weight: bold; }
  .row.dis { opacity: .35; }
  .row.sel { background: #f2a900; color: #000; }
  .row.sel .t { color: #000; }
  .x { flex: none; width: 40px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #2d3640; }
  .x.sel { background: #fff; color: #000; box-shadow: 0 0 0 3px #00A2ED; }
  .sep { height: 6px; background: #111; }
  .navrow { padding: 4px 8px; gap: 8px; }
  .arrow { flex: 1; height: 38px; border-radius: 6px; background: #2d3640; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .arrow.dis { opacity: .3; }
  .arrow.sel { background: #f2a900; color: #000; }
  /* the remote: this page when the browser is on the external screen (it covers the whole console screen) */
  #remote { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; z-index: 5; }
  #remote .rbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px; background: #000; }
  .rb { flex: none; min-width: 44px; height: 38px; border: 0; border-radius: 8px; background: #2d3640; color: #fff; font-size: 22px; }
  .rb.dis { opacity: .3; }
  #rurl { flex: 1; min-width: 0; height: 38px; border: 0; border-radius: 19px; padding: 0 14px; background: #2d3640; color: #fff; font: 17px "DejaVu Sans", sans-serif; outline: 0; }
  #rurl:focus { background: #fff; color: #000; }
  #rnote { flex: none; padding: 6px 14px; background: #3a2a00; color: #f2c14e; font-size: 15px; display: none; }
  #rbody { flex: 1; overflow-y: auto; }
  #remote h4 { margin: 10px 14px 4px; font-size: 14px; font-weight: normal; color: #8a97a3; text-transform: uppercase; letter-spacing: .5px; }
  #remote .rrow { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 18px; border-bottom: 1px solid #2a323a; }
  #remote .rrow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #remote .rrow.cur .t { color: #f2a900; font-weight: bold; }
  #remote .rrow .u { color: #8a97a3; font-size: 13px; margin-inline-start: 8px; }
  #remote .rb:focus, #remote .rrow:focus { outline: 3px solid #f2a900; outline-offset: -3px; }
  #remote .x { flex: none; width: 40px; height: 34px; border: 0; border-radius: 6px; background: #2d3640; color: #fff; font-size: 18px; }
</style>
<div id="remote">
  <div class="rbar">
    <button id="rback" class="rb" data-nav aria-label="Back">←</button>
    <button id="rfwd" class="rb" data-nav aria-label="Forward">→</button>
    <button id="rreload" class="rb" data-nav aria-label="Reload">⟳</button>
    <input id="rurl" type="text" data-nav placeholder="Search or enter address" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="rstar" class="rb" data-nav aria-label="Bookmark">★</button>
  </div>
  <div id="rnote"></div>
  <div id="rbody"></div>
</div>
<div id="strip">
  <input id="url" type="text" placeholder="Search or enter address" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="kebab" aria-label="Menu"><i></i><i></i><i></i></button>
</div>
<div id="bar"></div>
<div id="shade"></div>
<div id="menu"></div>
<script src="/platform.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const host = m => { try { window.webkit.messageHandlers.host.postMessage(m); } catch (e) {} };
  let st = {tabs: [], home: '', active: 0, max: 5, back: false, fwd: false, loading: false};
  let menuOpen = false, oskOpen = false, sel = 0, onX = false, navSel = 0, lastCapture = null, sessionReady = false, savedKey = '', lastBody = '', savedAt = 0;
  let disp = {connected: false, stack: [], top: null};           // the external screen (Platform.display.status)
  let remote = false;                                              // the browser's page is on the external screen: this page is its remote
  let rst = {tabs: [], home: '', active: 0, max: 5, back: false, fwd: false, loading: false};   // the big window's state, as it tells us
  let marks = [];                                                  // the bookmarks [{title, url}]
  const bigVisible = () => disp.connected && disp.top === 'browser';

  const blank = t => !t || !t.uri || t.uri === 'about:blank';
  const titleOf = t => blank(t) ? 'New tab' : (t.title || t.uri);
  const urlOf = t => (blank(t) || t.uri === st.home) ? '' : t.uri;   // the start page shows an empty address

  // ---- the session: the tabs come back at the next start -----------------------------------------------------
  const live = () => remote ? rst : st;                           // whose tabs are the tabs: this window's, or the big window's
  function sessionKey() { return JSON.stringify({active: live().active, urls: live().tabs.map(t => t.uri).filter(u => u)}); }
  function sessionBody() { const ts = live().tabs.filter(t => t.uri); return JSON.stringify({active: live().active, urls: ts.map(t => t.uri), scrolls: ts.map(t => t.scroll | 0)}); }
  let saveTimer = null;
  function saveSession(force) {
    clearTimeout(saveTimer);
    if (!sessionReady) return Promise.resolve();
    const k = sessionKey(), body = sessionBody();
    if (JSON.parse(k).urls.length === 0 || body === lastBody) return Promise.resolve();
    if (!force && k === savedKey && Date.now() - savedAt < 8000) return Promise.resolve();   // only the scroll changed: not at every flick
    savedKey = k; lastBody = body; savedAt = Date.now();
    return Platform.db.set('session', body).catch(() => {});
  }
  const restoreCmd = s => 'restore:' + (s.active | 0) + '|' + s.urls.map((u, i) => u + '\t' + (((s.scrolls || [])[i]) | 0)).join('\n');

  // ---- host state -------------------------------------------------------------------------------------
  window.ic = {state(s) {
    st = s;
    if (document.activeElement !== $('#url')) { $('#url').value = urlOf(s.tabs[s.active]); urlClr(); }
    $('#bar').style.width = s.loading ? '60%' : '0';
    if (menuOpen) drawMenu();
    clearTimeout(saveTimer); saveTimer = setTimeout(saveSession, 700);
  }};

  function capture() {
    const c = menuOpen || oskOpen || remote;
    if (c !== lastCapture) { lastCapture = c; host('capture:' + (c ? 1 : 0)); }
  }

  // ---- menu -------------------------------------------------------------------------------------------
  // rows: the tabs, then New tab, then one row with the Back and Forward arrows and Reload
  const rowCount = () => st.tabs.length + 2;
  const isNav = i => i === st.tabs.length + 1;
  const NAV = ['back', 'fwd', 'reload'];
  const navOn = k => k === 0 ? st.back : k === 1 ? st.fwd : !blank(st.tabs[st.active]);
  function enabled(i) {
    if (i < st.tabs.length) return true;
    return isNav(i) ? NAV.some((n, k) => navOn(k)) : st.tabs.length < st.max;
  }
  function drawMenu() {
    const m = $('#menu'); m.innerHTML = '';
    for (let i = 0; i < rowCount(); i++) {
      const d = document.createElement('div');
      const isTab = i < st.tabs.length;
      if (isNav(i)) {
        d.className = 'row navrow';
        ['←', '→', '⟳'].forEach((g, k) => {
          const a = document.createElement('div');
          a.className = 'arrow' + (navOn(k) ? '' : ' dis') + (i === sel && navSel === k && navOn(k) ? ' sel' : '');
          a.textContent = g;
          a.onclick = () => { if (navOn(k)) { host(NAV[k]); closeMenu(); } };
          d.appendChild(a);
        });
        m.appendChild(d);
        continue;
      }
      d.className = 'row' + (isTab && i === st.active ? ' cur' : '') + (enabled(i) ? '' : ' dis') + (i === sel && !onX ? ' sel' : ''); d.setAttribute('role', 'menuitem');
      const t = document.createElement('span'); t.className = 't'; t.textContent = isTab ? titleOf(st.tabs[i]) : 'New tab'; d.appendChild(t);
      if (isTab && !blank(st.tabs[i])) t.setAttribute('translate', 'no');   // a page's own title is not ours to translate
      if (isTab) {
        const x = document.createElement('span'); x.className = 'x' + (i === sel && onX ? ' sel' : ''); x.textContent = '✕';
        x.onclick = e => { e.stopPropagation(); closeTab(i); };
        d.appendChild(x);
      }
      d.onclick = () => { sel = i; onX = false; activate(); };
      m.appendChild(d);
      if (i === st.tabs.length - 1) { const s = document.createElement('div'); s.className = 'sep'; m.appendChild(s); }
    }
  }
  // the keyboard goes away when the screen changes under it (the menu opens, the browser moves to the other screen): it would cover the menu, or type into a field that is gone
  function keyboardAway() { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); if (window.__osk) window.__osk.hide(true); }
  function openMenu() { keyboardAway(); menuOpen = true; sel = st.active; onX = false; navSel = Math.max(0, [0, 1, 2].findIndex(navOn)); $('#menu').style.display = 'block'; $('#shade').style.display = 'block'; drawMenu(); capture(); }
  function closeMenu() { menuOpen = false; $('#menu').style.display = 'none'; $('#shade').style.display = 'none'; capture(); }
  function closeTab(i) { host('close:' + i); onX = false; sel = Math.min(sel, Math.max(0, st.tabs.length - 2)); }
  function activate() {
    if (!enabled(sel)) return;
    if (sel < st.tabs.length) { host('switch:' + sel); closeMenu(); return; }
    if (isNav(sel)) { if (navOn(navSel)) { host(NAV[navSel]); closeMenu(); } return; }
    host('newtab'); closeMenu();
  }
  $('#kebab').addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
  $('#shade').addEventListener('click', closeMenu);

  // ---- address ----------------------------------------------------------------------------------------
  // the ✕ at the end of an address field: clears it; the field keeps (or takes) the focus, so the keyboard is there to type the new one
  function clearable(inp) {
    const b = document.createElement('button'); b.className = 'clr'; b.setAttribute('aria-label', 'Clear'); b.textContent = '✕';
    inp.after(b);
    const sync = () => { b.style.display = inp.value ? 'flex' : 'none'; };
    b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('click', () => { inp.value = ''; sync(); inp.focus(); });
    inp.addEventListener('input', sync);
    return sync;
  }
  const url = $('#url'), urlClr = clearable(url), rurlClr = clearable($('#rurl'));
  url.addEventListener('focus', () => { url.select(); });
  url.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const v = url.value.trim(); url.blur(); if (v) host('nav:' + v); }
  });
  url.addEventListener('blur', () => { url.value = urlOf(st.tabs[st.active]); urlClr(); });
  // the keyboard asks for all the input while it is up, and gives it back when it is put away
  addEventListener('osk', e => {
    oskOpen = e.detail.height > 0; capture();
    fetch('/api/log', {method: 'POST', body: JSON.stringify({msg: 'browser osk ' + Math.round(e.detail.height)})}).catch(() => {});   // for the tests: is the keyboard up
  });

  // ---- keys: arrows and Enter in the menu (no device button opens anything) -----------------------------------
  addEventListener('keydown', e => {
    if (!menuOpen) return;
    const last = rowCount() - 1;
    if (e.key === 'ArrowDown') { onX = false; sel = Math.min(last, sel + 1); }
    else if (e.key === 'ArrowUp') { onX = false; sel = Math.max(0, sel - 1); }
    else if (e.key === 'ArrowRight') { if (sel < st.tabs.length) onX = true; else if (isNav(sel)) navSel = Math.min(2, navSel + 1); }
    else if (e.key === 'ArrowLeft') { if (isNav(sel)) navSel = Math.max(0, navSel - 1); else onX = false; }
    else if (e.key === 'Enter') { e.preventDefault(); if (onX) closeTab(sel); else activate(); return; }
    else if (e.key === 'Escape') { closeMenu(); }
    else return;
    e.preventDefault(); drawMenu();
  });

  // ---- the remote: the browser is on the external screen ------------------------------------------------------------------
  const $$ = s => [...document.querySelectorAll(s)];
  const send = cmd => Platform.display.send({cmd}).then(r => { if (!r.delivered) drawRemote(); }, () => drawRemote());
  const markUrl = () => { const t = rst.tabs[rst.active]; return t && t.uri && t.uri !== 'about:blank' ? t.uri : ''; };
  function drawRemote() {
    if (!remote) return;
    $('#rback').classList.toggle('dis', !rst.back); $('#rfwd').classList.toggle('dis', !rst.fwd);
    $('#rstar').style.color = marks.some(m => m.url === markUrl()) ? '#f2a900' : '#fff';
    if (document.activeElement !== $('#rurl')) { $('#rurl').value = urlOf(rst.tabs[rst.active]); rurlClr(); }
    const note = !disp.connected ? Platform.t('The external screen is unplugged. The tabs are kept.') : !bigVisible() ? Platform.t('Another app is on the external screen. The browser comes back when it closes.') : '';
    $('#rnote').style.display = note ? 'block' : 'none'; $('#rnote').textContent = note;
    const b = $('#rbody'); b.innerHTML = '';
    const h = t => { const e = document.createElement('h4'); e.textContent = Platform.t(t); b.appendChild(e); };
    const row = (cls, text, small, onclick, onx) => {
      const d = document.createElement('div'); d.className = 'rrow ' + cls; d.tabIndex = 0; d.setAttribute('data-nav', ''); d.setAttribute('role', 'button');
      const t = document.createElement('span'); t.className = 't'; t.textContent = text; t.setAttribute('translate', 'no'); d.appendChild(t);
      if (small) { const u = document.createElement('span'); u.className = 'u'; u.textContent = small; t.appendChild(u); }
      d.onclick = onclick;
      if (onx) { const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('data-nav', ''); x.onclick = e => { e.stopPropagation(); onx(); }; d.appendChild(x); }
      b.appendChild(d); return d;
    };
    h('Tabs');
    rst.tabs.forEach((t, i) => row(i === rst.active ? 'cur' : '', titleOf(t), '', () => send('switch:' + i), () => send('close:' + i)));
    if (rst.tabs.length < rst.max) { const n = row('', Platform.t('New tab'), '', () => send('newtab')); n.querySelector('.t').removeAttribute('translate'); }
    if (marks.length) {
      h('Bookmarks');
      marks.forEach(m => row('', m.title || m.url, '', () => send('nav:' + m.url), () => { marks = marks.filter(x => x !== m); saveMarks(); drawRemote(); }));
    }
  }
  const saveMarks = () => Platform.db.set('bookmarks', JSON.stringify(marks)).catch(() => {});
  $('#rback').onclick = () => rst.back && send('back');
  $('#rfwd').onclick = () => rst.fwd && send('fwd');
  $('#rreload').onclick = () => send('reload');
  $('#rstar').onclick = () => {
    const u = markUrl(); if (!u) return;
    marks = marks.some(m => m.url === u) ? marks.filter(m => m.url !== u) : [...marks, {title: titleOf(rst.tabs[rst.active]), url: u}];
    saveMarks(); drawRemote();
  };
  $('#rurl').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const v = $('#rurl').value.trim(); $('#rurl').blur(); if (v) send('nav:' + v); } });
  $('#rurl').addEventListener('focus', () => $('#rurl').select());
  $('#rurl').addEventListener('blur', () => { $('#rurl').value = urlOf(rst.tabs[rst.active]); rurlClr(); });
  // the cursor and A in the remote: the arrows go through the buttons and rows, Enter presses (B: puts the keyboard away)
  addEventListener('keydown', e => {
    if (!remote || menuOpen) return;
    const items = $$('#remote [data-nav]'), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') items[Math.min(items.length - 1, i + 1)].focus();
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') items[Math.max(0, i - 1)].focus();
    else if (e.key === 'Enter' && i >= 0 && document.activeElement.tagName !== 'INPUT') document.activeElement.click();
    else if (e.key === 'Escape') document.activeElement.blur();
    else return;
    e.preventDefault();
  });

  let mirrorTimer = null;
  Platform.display.onMessage(m => {
    if (!m || !m.state) return;
    rst = m.state; drawRemote();
    clearTimeout(mirrorTimer); mirrorTimer = setTimeout(() => saveSession(), 1000);   // the session is always the latest, wherever the tabs are
  });

  function setRemote(on) {
    if (on === remote) return;
    keyboardAway();
    remote = on;
    $('#remote').style.display = on ? 'flex' : 'none';
    if (on) {
      closeMenu();
      host('detach');                                                // this window lets go of the tabs: the big window has them
      rst = {tabs: [], home: st.home, active: 0, max: st.max, back: false, fwd: false, loading: false};
      Platform.display.send({cmd: 'state?'}).catch(() => {});
    }
    capture(); drawRemote();
  }
  async function showOnExternal() {
    if (!disp.connected || remote) return;
    closeMenu();
    await saveSession(true);
    const ts = st.tabs.filter(t => t.uri);
    try { await Platform.display.open({active: st.active, urls: ts.map(t => t.uri), scrolls: ts.map(t => t.scroll | 0)}); }
    catch (e) { return; }
    setRemote(true);
  }
  async function takeTabsBack() {
    let s = null;
    try { const v = await Platform.db.get('session'); if (v) s = JSON.parse(v); } catch (e) {}
    setRemote(false);
    if (s && s.urls && s.urls.length) host(restoreCmd(s));
  }
  async function leaveRemote() {
    if (!remote) return;
    await saveSession(true);
    try { await Platform.display.close(); } catch (e) {}              // the big page saves and goes; the app under it, or the cat, takes the screen
    await takeTabsBack();
  }
  Platform.display.on(e => {
    disp = {connected: e.connected, stack: e.stack || [], top: e.top};
    // the owner's rule: with an external monitor the page is on it. Plugged in while the browser is open: the page goes there; pulled out: the tabs come back here
    if (e.event === 'connected' && !remote) { showOnExternal(); return; }
    if (e.event === 'disconnected' && remote) { leaveRemote(); return; }
    const inStack = disp.stack.includes('browser');
    if (inStack && !remote) setRemote(true);                         // the big page was opened by somebody else (Caroline)
    else if (!inStack && remote) takeTabsBack();                     // ... or taken off by somebody else
    else if (remote && e.event === 'stack' && disp.top === 'browser') Platform.display.send({cmd: 'state?'}).catch(() => {});
    drawRemote(); if (menuOpen) drawMenu();
  });

  // the last state is written before the browser is closed
  Platform.onClose(async () => { host('sync'); await new Promise(r => setTimeout(r, 400)); await saveSession(true); });   // 'sync': where the pages are scrolled to, now

  // ---- start: bring the tabs of the last session back, then tell the host we are ready ---------------------------
  (async () => {
    // the keyboard for the pages: the same bundle (layouts and words in the interface language) goes to the host, which injects it
    try { host('osk:' + await (await fetch('/osk-bundle.js')).text()); } catch (e) {}
    try { marks = JSON.parse((await Platform.db.get('bookmarks')) || '[]'); } catch (e) {}
    try { const d = await Platform.display.status(); disp = {connected: d.connected, stack: d.stack || [], top: d.top}; } catch (e) {}
    let s = null;
    try { const v = await Platform.db.get('session'); if (v) s = JSON.parse(v); } catch (e) {}
    if (disp.stack.includes('browser')) setRemote(true);             // the browser is on the external screen already: this page is its remote, the tabs are there
    else if (disp.connected) {                                         // an external monitor is plugged in: the page goes there at once (big.html takes the saved session)
      sessionReady = true; host('ready');
      try { await Platform.display.open({}); setRemote(true); } catch (e) { if (s && s.urls && s.urls.length) host(restoreCmd(s)); }
      return;
    }
    else if (s && Array.isArray(s.urls) && s.urls.length) {
      savedKey = JSON.stringify({active: s.active | 0, urls: s.urls}); lastBody = JSON.stringify({active: s.active | 0, urls: s.urls, scrolls: s.urls.map((u, i) => ((s.scrolls || [])[i]) | 0)});
      host(restoreCmd(s));
    }
    sessionReady = true;
    host('ready');
  })();
</script>
