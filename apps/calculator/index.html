<meta charset="utf-8">
<title>Calculator</title>
<meta name="viewport" content="width=640,height=480">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #disp { flex: none; height: 112px; padding: 8px 14px; background: #000; display: flex; flex-direction: column; justify-content: flex-end; text-align: right; }
  /* left to right as it is typed; a long one shows its end: the flex box is aligned to the right, so what does not fit is cut at the start
     (direction: rtl did the same but turned "12+3" into "3+12": the operators were reordered as in right-to-left text) */
  #expr { font-size: 22px; color: #8a949e; min-height: 28px; white-space: nowrap; overflow: hidden; display: flex; justify-content: flex-end; }
  #res { font-size: 46px; color: #f2a900; font-weight: bold; white-space: nowrap; overflow: hidden; line-height: 56px; }
  #pad { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: 4px; padding: 4px; }
  .k { display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 6px; background: #1d242b; }
  .k.op { color: #f2a900; }
  .k.sel { background: #f2a900; color: #000; }
  .k.eq { grid-column: 1 / 5; }
</style>
<div id="disp"><div id="expr"></div><div id="res">0</div></div>
<div id="pad"></div>
<script src="/platform.js"></script>
<script>
  // rows of keys: [label, action]; an action is a text to append, or one of C, BS, EQ
  const ROWS = [
    [['C', 'C'], ['⌫', 'BS'], ['(', '('], [')', ')']],
    [['7', '7'], ['8', '8'], ['9', '9'], ['÷', '/']],
    [['4', '4'], ['5', '5'], ['6', '6'], ['×', '*']],
    [['1', '1'], ['2', '2'], ['3', '3'], ['−', '-']],
    [['0', '0'], ['.', '.'], ['%', '%'], ['+', '+']],
    [['=', 'EQ']],
  ];
  const cells = [];
  const pad = document.getElementById('pad');
  ROWS.forEach((row, r) => row.forEach(([label, act], c) => {
    const el = document.createElement('div');
    el.className = 'k' + (/^[÷×−+%=]$/.test(label) ? ' op' : '') + (act === 'EQ' ? ' eq' : '');
    el.textContent = label;
    el.onclick = () => { pos = cells.findIndex(k => k.el === el); press(act); draw(); };
    pad.appendChild(el);
    cells.push({r, c, act, el});
  }));

  let expr = '', result = '', shown = false, pos = cells.findIndex(k => k.act === '7');

  // expression -> number: + - * / %, parentheses, unary minus; x% means x/100
  function evaluate(src) {
    const tok = src.match(/\d+\.?\d*|\.\d+|[-+*\/%()]/g) || [];
    if (tok.join('') !== src) throw new Error('syntax');
    let i = 0;
    const peek = () => tok[i];
    function expression() {
      let v = term();
      while (peek() === '+' || peek() === '-') v = tok[i++] === '+' ? v + term() : v - term();
      return v;
    }
    function term() {
      let v = unary();
      while (peek() === '*' || peek() === '/') v = tok[i++] === '*' ? v * unary() : v / unary();
      return v;
    }
    function unary() {
      if (peek() === '-') { i++; return -unary(); }
      if (peek() === '+') { i++; return unary(); }
      let v = primary();
      while (peek() === '%') { i++; v /= 100; }
      return v;
    }
    function primary() {
      const t = tok[i++];
      if (t === '(') { const v = expression(); if (tok[i++] !== ')') throw new Error('syntax'); return v; }
      if (t === undefined || !/^[\d.]/.test(t)) throw new Error('syntax');
      return parseFloat(t);
    }
    const v = expression();
    if (i !== tok.length) throw new Error('syntax');
    if (!isFinite(v)) throw new Error('math');
    return v;
  }

  const fmt = v => String(Number(v.toPrecision(12)));

  function press(act) {
    if (act === 'C') { expr = ''; result = ''; shown = false; return; }
    if (act === 'BS') { if (shown) { shown = false; result = ''; } expr = expr.slice(0, -1); return; }
    if (act === 'EQ') {
      if (!expr) return;
      try { result = fmt(evaluate(expr)); expr += '='; shown = true; }
      catch (e) { result = Platform.t('Error'); shown = true; expr = ''; }
      return;
    }
    if (shown) {   // after "=": a digit starts anew, an operator continues with the result
      const prev = result;
      expr = /^[\d.(]$/.test(act) || isNaN(Number(prev)) ? '' : prev;
      if (prev.startsWith('-')) expr = expr ? '(' + expr + ')' : '';
      shown = false; result = '';
    }
    // an operator needs a number before it; a second one replaces the first ("2+" then "×" gives "2×"); only a minus may follow × or ÷ (a sign)
    if (/^[-+*\/%]$/.test(act)) {
      if (act === '%') { if (!/[\d.)%]$/.test(expr)) return; }
      else if (act === '-' && /(^|[(*\/])$/.test(expr)) { /* a sign */ }
      else {
        expr = expr.replace(/[-+*\/]+$/, '');
        if (!expr || expr.endsWith('(')) { if (act !== '-') return; }
      }
    }
    expr += act;
    try { result = fmt(evaluate(expr)); } catch (e) { result = ''; }   // live preview while it parses
  }

  function draw() {
    document.getElementById('expr').textContent = expr.replace(/\//g, '÷').replace(/\*/g, '×').replace(/-/g, '−');
    document.getElementById('res').textContent = result || (expr ? '' : '0');
    cells.forEach((k, i) => k.el.classList.toggle('sel', i === pos));
  }

  function move(dr, dc) {
    const cur = cells[pos];
    if (dr) {
      const r = cur.r + dr; if (r < 0 || r >= ROWS.length) return;
      pos = cells.findIndex(k => k.r === r && k.c === cur.c);
      if (pos < 0) pos = cells.findIndex(k => k.r === r);
    } else {
      const c = cur.c + dc;
      const n = cells.findIndex(k => k.r === cur.r && k.c === c);
      if (n >= 0) pos = n;
    }
  }

  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp') move(-1, 0);
    else if (k === 'ArrowDown') move(1, 0);
    else if (k === 'ArrowLeft') move(0, -1);
    else if (k === 'ArrowRight') move(0, 1);
    else if (k === 'Enter') press(cells[pos].act);      // A on the console
    else if (k === 'Backspace') press('BS');
    else if (k === 'Delete' || k === 'c' || k === 'C') press('C');
    else if (k === '=') press('EQ');
    else if (/^[\d+\-*\/%().]$/.test(k)) press(k);
    else if (k === ',') press('.');
    else return;
    e.preventDefault(); draw();
  });

  // state: the display and the cursor come back as they were when the app is opened again (it shares its window with the other apps)
  Platform.onClose(() => Platform.state.set({expr, result, shown, pos}));
  Platform.state.get().then(s => {
    if (!s) return;
    expr = String(s.expr || ''); result = String(s.result || ''); shown = !!s.shown;
    if (Number.isInteger(s.pos) && s.pos >= 0 && s.pos < cells.length) pos = s.pos;
    draw();
  });

  draw();
  // Caroline's tools for this page (manifest: "caroline"): the display, and a sum keyed in on the pad
  const display = () => (expr ? expr + ' ' : '') + (result || (expr ? '' : '0'));
  Platform.tools.handle('get_display', async () => display());
  Platform.tools.handle('calculate', async args => {
    const src = String(args.expression || '').replace(/\s+/g, '').replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/,/g, '.');
    press('C');
    for (const ch of src) press(ch);
    press('EQ'); draw();
    return display();
  });
  Platform.tools.handle('clear', async () => { press('C'); draw(); return display(); });

</script>
