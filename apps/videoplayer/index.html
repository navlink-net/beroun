<meta charset="utf-8">
<title>Video</title>
<meta name="viewport" content="width=640,height=480">
<!--
  The video player: plays the video files of the SD card, a folder at a time (with all its subfolders when started from the
  play button of a folder). Same principle as the audio player (apps/audioplayer).
  Keys: the cursor keys, Enter (A) and Escape (B). There is no other key mapping; MODE leaves the app, as everywhere.
  The place is remembered (the videos, which one, the time, the order, the folder) and the next start goes on from it. A video
  that the system opens (from the file manager, or the saved place at the start) waits stopped, with a big Play button over the
  picture: sound may only start after a press, and the player does not start by itself behind the user's back.
  Browse   Up / Down select, Enter opens a folder or plays a file (the videos of its folder follow it). Every folder row has a
           play button (touch / mouse): it plays the folder with all its subfolders. Escape (B) goes up one level; at the top
           level it leaves the app.
  Playing  The picture fills the screen. Any of A / B / X / Y / the cursor (or a touch) shows the toolbar over it, and it hides
           after 3 s while the video plays. With the toolbar hidden that press only shows it; with it up: Enter plays / pauses,
           Left / Right seek 10 s, Up / Down previous / next video, Escape (B) stops and goes back to the browser (X and Y do nothing more).
           Touch / mouse: the button row (previous, rewind, play / pause, stop, fast forward, next, order); rewind and fast
           forward seek 10 s on a tap and scan while held; tap the bar to seek, tap the picture to show / hide the controls.
  The EXTERNAL SCREEN (docs/system-api.md; the owner's rule): with an external monitor plugged in, the picture is on it, by itself (a video started with the monitor in, or the
  monitor plugged in while a video is up). It plays in big.html (the one <video> there) and this page is the remote: the same toolbar, the title, the time and the queue, no picture. The queue,
  the order and the saved place stay here; the player (P below) is either the <video> of this page or that of big.html, which hears play / pause / seek / src as messages and says time / ended /
  error. Covered by another app on the big screen, the big page keeps its place and comes back at it. Unplugged: the picture comes back here at the place it has reached.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #head { flex: none; height: 40px; line-height: 40px; padding: 0 14px; background: #000; color: #f2a900; font-size: 20px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foot { flex: none; height: 26px; line-height: 26px; padding: 0 14px; background: #1d242b; color: #aab; font-size: 14px; white-space: nowrap; overflow: hidden; }
  #msg { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: 0; overflow: hidden; background: #3a2a00; color: #f2a900; font-size: 16px; padding: 0 14px; line-height: 28px; white-space: nowrap; }
  #msg.on { height: 28px; }
  #browse { flex: 1; min-height: 0; display: none; flex-direction: column; }
  #browse.on { display: flex; }
  .list { flex: 1; min-height: 0; overflow: auto; touch-action: none; }
  .row { height: 44px; display: flex; align-items: center; padding: 0 14px; gap: 10px; font-size: 20px; }
  .row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { flex: none; font-size: 15px; opacity: .7; }
  .row.dir .name { color: #8cf; }
  .row.sel { background: #f2a900; color: #000; }
  .row.sel .name, .row.sel .tag { color: #000; }
  .pbtn { flex: none; width: 48px; height: 34px; border: 0; border-radius: 17px; background: #f2a900; color: #000; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -6px; }
  .pbtn svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
  .pbtn:active { background: #ffc43a; }
  .row.sel .pbtn { background: #000; color: #f2a900; }

  #play { position: fixed; inset: 0; z-index: 5; display: none; background: #000; }
  #play.on { display: block; }
  #v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #big { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -70px 0 0 -60px; z-index: 3; border: 0; border-radius: 60px; background: #f2a900e6; color: #000; display: none; align-items: center; justify-content: center; padding: 0; box-shadow: 0 4px 24px #000a; }
  #big.on { display: flex; }
  #big:active { background: #ffc43a; }
  #big svg { width: 68px; height: 68px; fill: currentColor; pointer-events: none; }
  #ovl { position: absolute; inset: 0; transition: opacity .25s; }
  #ovl.off { opacity: 0; pointer-events: none; }
  #otop { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px 26px; background: linear-gradient(#000c, #0000); }
  #title { font-size: 22px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: 14px; color: #b3bcc4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #obot { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 14px 8px; background: linear-gradient(#0000, #000d); }
  #bar { height: 14px; border-radius: 7px; background: #ffffff40; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #f2a900; }
  #times { display: flex; justify-content: space-between; font-size: 15px; color: #dde; margin-top: 3px; }
  #state { color: #9be29b; }
  #ctl { display: flex; align-items: center; justify-content: center; gap: 8px; padding-top: 4px; }
  .btn { flex: none; width: 58px; height: 46px; border: 0; border-radius: 12px; background: #232b33cc; color: #e8ecef; display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none; }
  .btn svg { width: 28px; height: 28px; fill: currentColor; pointer-events: none; }
  .btn:active, .btn.hold { background: #3a4651; }
  .btn.dis { opacity: .35; }
  #bplay { width: 78px; height: 60px; border-radius: 30px; background: #f2a900; color: #000; }
  #bplay:active { background: #ffc43a; }
  #bplay svg { width: 36px; height: 36px; }
  #border { color: #8a949e; }
  #border.on { color: #f2a900; }
</style>
<div id="head"></div>
<div id="msg"></div>
<div id="browse"><div id="blist" class="list"></div></div>
<div id="play">
  <video id="v" playsinline preload="auto"></video>
  <button id="big" aria-label="Play"></button>
  <div id="ovl">
    <div id="otop"><div id="title"></div><div id="sub"></div></div>
    <div id="obot">
      <div id="bar"><div id="fill"></div></div>
      <div id="times"><span id="cur">0:00</span><span id="state"></span><span id="dur">0:00</span></div>
      <div id="ctl">
        <button class="btn" id="bprev" aria-label="Previous"></button>
        <button class="btn" id="brew" aria-label="Rewind"></button>
        <button class="btn" id="bplay" aria-label="Play / Pause"></button>
        <button class="btn" id="bstop" aria-label="Stop"></button>
        <button class="btn" id="bffw" aria-label="Fast forward"></button>
        <button class="btn" id="bnext" aria-label="Next"></button>
        <button class="btn" id="border" aria-label="Order"></button>
      </div>
    </div>
  </div>
</div>
<div id="foot"></div>
<script src="/platform.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const VIDEO = ['mp4', 'm4v', 'webm', 'mkv', 'mov', 'ogv'];
  const ext = n => (n.split('.').pop() || '').toLowerCase();
  const isVideo = n => VIDEO.includes(ext(n));
  const base = p => p.split('/').pop(), dirOf = p => p.split('/').slice(0, -1).join('/');
  const stem = n => n.replace(/\.[^.]*$/, '');
  const join = (d, n) => (d ? d + '/' : '') + n;
  const nat = (x, y) => x.localeCompare(y, undefined, {numeric: true, sensitivity: 'base'});
  const T = s => Platform.t(s);

  const v = $('#v'), ovl = $('#ovl');
  // The player. `local` is the <video> of this page; `remote` is the one of big.html on the external screen (messages: src / play / pause / seekto / clear, and back time / ended / error / ready).
  // Everything below plays through P.
  const sendBig = m => Platform.display.send(m).catch(() => {});
  const local = {
    // pending: the place a video that is still loading will start at; until then it is the place (the cable plugged in again at once would take the picture to the big screen at 0)
    pending: null,
    get currentTime() { return this.pending !== null ? this.pending : v.currentTime; }, set currentTime(x) { if (this.pending !== null) this.pending = x; else v.currentTime = x; },
    get duration() { return v.duration; }, get paused() { return v.paused; },
    play() { return v.play(); }, pause() { v.pause(); },
    load(url, resume, play) {
      v.src = url;
      this.pending = resume > 0 ? resume : null;
      if (resume > 0) v.addEventListener('loadedmetadata', () => { if (this.pending !== null) v.currentTime = this.pending; this.pending = null; }, {once: true});   // continue from the saved place
      if (play) v.play().catch(e => { if (e.name !== 'AbortError' && e.name !== 'NotAllowedError') say(T('Cannot play') + ': ' + base(queue[qi])); });
    },
    clear() { this.pending = null; v.pause(); v.removeAttribute('src'); v.load(); },
  };
  const remote = {
    t: 0, d: NaN, p: true,
    get currentTime() { return this.t; }, set currentTime(x) { this.t = x; sendBig({cmd: 'seekto', t: x}); },
    get duration() { return this.d; }, get paused() { return this.p; },
    play() { this.p = false; sendBig({cmd: 'play'}); return Promise.resolve(); }, pause() { this.p = true; sendBig({cmd: 'pause'}); },
    load(url, resume, play) { this.t = resume || 0; this.d = NaN; this.p = !play; sendBig({cmd: 'src', url, time: resume || 0, play: !!play}); },
    clear() { this.t = 0; this.d = NaN; this.p = true; sendBig({cmd: 'clear'}); },
  };
  let P = local;
  let disp = {connected: false, stack: [], top: null};   // the external screen (Platform.display)
  const wantsBig = () => disp.stack.includes('videoplayer');
  let view = 'browse', cwd = '', rows = [], sel = 0;
  let queue = [], qi = -1, order = 0, fails = 0;   // order: index into ORDERS
  const ORDERS = ['Normal', 'Repeat all', 'Repeat one', 'Shuffle'];
  let msgTimer = null, hideTimer = null, busy = false;

  function say(text) {
    const m = $('#msg'); m.textContent = text; m.classList.add('on');
    clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('on'), 3500);
  }
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };

  // ---- the card -------------------------------------------------------------------------------
  async function entries(path) {
    return (await Platform.files.list(path)).entries;
  }
  // the video files of a folder (and of its subfolders when deep), in name order
  async function collect(path, deep, out = []) {
    const es = await entries(path);
    es.filter(e => !e.dir && isVideo(e.name)).map(e => e.name).sort(nat).forEach(n => out.push(join(path, n)));
    if (deep) for (const d of es.filter(e => e.dir).map(e => e.name).sort(nat)) { if (out.length >= 3000) break; await collect(join(path, d), true, out); }
    return out;
  }
  async function loadRows() {
    try {
      const es = (await entries(cwd)).filter(e => e.dir || isVideo(e.name));
      const dirs = es.filter(e => e.dir).sort((x, y) => nat(x.name, y.name));
      const files = es.filter(e => !e.dir).sort((x, y) => nat(x.name, y.name));
      rows = (cwd ? [{up: true}] : []).concat(dirs.map(e => ({name: e.name, dir: true})), files.map(e => ({name: e.name})));
    } catch (e) { say(e.message); rows = cwd ? [{up: true}] : []; }
    draw();
  }

  // ---- the queue and the picture --------------------------------------------------------------
  // stopped: open the video without playing it (a video opened by the system, not by a press in this app, waits for Play)
  function startQueue(paths, at, resume, stopped) {
    if (!paths.length) return say(T('Nothing to play'));
    queue = paths; fails = 0; playAt(at || 0, resume, stopped);
  }
  function playAt(i, resume, stopped) {
    if (i < 0 || i >= queue.length) return;
    qi = i;
    if (disp.connected && P === local) goBig(resume > 0 ? resume : 0, !stopped);   // with a monitor the picture is on it
    else P.load(Platform.files.videoUrl(queue[i]), resume > 0 ? resume : 0, !stopped);
    saveState(true, resume || 0);
    draw();
  }
  // where we are is remembered (the queue, the video, the time, the order, the folder) and picked up at the next start
  let lastSave = 0;
  function saveState(force, time) {
    if (qi < 0) return Promise.resolve();
    const now = Date.now(); if (!force && now - lastSave < 4000) return Promise.resolve();
    lastSave = now;
    const t = time !== undefined ? time : (isFinite(P.duration) && P.duration - P.currentTime < 3) ? 0 : P.currentTime;
    return Platform.state.set({queue, qi, time: t, order, cwd}).catch(() => {});
  }
  Platform.onClose(() => saveState(true));
  function next(auto) {
    if (!queue.length) return;
    if (order === 3 && queue.length > 1) { let n; do { n = Math.floor(Math.random() * queue.length); } while (n === qi); return playAt(n); }
    if (qi + 1 < queue.length) return playAt(qi + 1);
    if (order === 1 || (!auto && order !== 0)) return playAt(0);
    if (!auto) return;
    P.pause(); P.currentTime = 0; showControls();   // the end of the queue
  }
  function prev() {
    if (!queue.length) return;
    if (P.currentTime > 3 || qi <= 0) { P.currentTime = 0; return; }
    playAt(qi - 1);
  }
  function toggle() {
    if (qi < 0) return;
    if (P.paused) P.play().catch(() => {}); else P.pause();
  }
  function stop() {
    if (qi < 0) return;
    P.pause(); P.currentTime = 0; drawTime(); showControls();
  }
  function seek(sec) {
    if (qi < 0 || !isFinite(P.duration)) return;
    P.currentTime = Math.min(P.duration, Math.max(0, P.currentTime + sec));
  }
  function leave() {   // back to the browser: the picture stops (the place stays remembered: the next start goes on from it)
    saveState(true);
    P.clear();
    if (P === remote) useLocal(true, 0, false);   // the picture goes off the big screen too
    queue = []; qi = -1; view = 'browse'; draw();
  }
  function onEnded() { if (order === 2) { P.currentTime = 0; P.play().catch(() => {}); } else next(true); }
  function onVideoError() {
    if (qi < 0) return;
    say(T('Cannot play') + ': ' + base(queue[qi]));
    if (++fails >= queue.length) { queue = []; qi = -1; P.clear(); view = 'browse'; return draw(); }   // none of them plays: do not go round for ever
    setTimeout(() => next(true), 800);
  }
  v.addEventListener('ended', () => { if (P === local) onEnded(); });
  v.addEventListener('error', () => { if (P === local) onVideoError(); });
  v.addEventListener('playing', () => { fails = 0; });
  for (const ev of ['timeupdate', 'durationchange', 'seeked']) v.addEventListener(ev, drawTime);
  v.addEventListener('play', () => { drawTime(); showControls(); });
  v.addEventListener('pause', () => { drawTime(); showControls(); if (P === local) saveState(true); });
  v.addEventListener('timeupdate', () => saveState(false));

  // the controls: shown on any key or touch, hidden after 3 s while the video plays
  function showControls() {
    ovl.classList.remove('off');
    clearTimeout(hideTimer);
    if (view === 'play' && !P.paused && P === local) hideTimer = setTimeout(() => ovl.classList.add('off'), 3000);   // on the remote the controls are all there is: they stay
  }

  // ---- drawing --------------------------------------------------------------------------------
  const svg = d => '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>';
  const ICON = {
    play: svg('M8 5v14l11-7z'),
    pause: svg('M6 5h4v14H6zM14 5h4v14h-4z'),
    stop: svg('M6 6h12v12H6z'),
    prev: svg('M6 6h2v12H6zM20 6v12L9.5 12z'),
    next: svg('M16 6h2v12h-2zM4 6v12l10.5-6z'),
    rew: svg('M11 18V6l-8.5 6zm.5-6l8.5 6V6z'),
    ffw: svg('M4 18l8.5-6L4 6zm9-12v12l8.5-6z'),
    order: [
      svg('M4 11h12l-4-4 1.4-1.4L20 12l-6.6 6.4L12 17l4-4H4z'),
      svg('M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z'),
      svg('M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4z'),
      svg('M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4l-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z'),
    ],
  };
  function drawTime() {
    if (view !== 'play') return;
    const d = isFinite(P.duration) ? P.duration : 0;
    $('#cur').textContent = fmt(P.currentTime); $('#dur').textContent = fmt(d);
    $('#fill').style.width = d ? Math.min(100, P.currentTime / d * 100) + '%' : '0';
    $('#state').textContent = qi < 0 ? '' : T(!P.paused ? 'Playing' : P.currentTime < 0.05 ? 'Stopped' : 'Paused');
    $('#bplay').innerHTML = P.paused ? ICON.play : ICON.pause;
    $('#big').classList.toggle('on', qi >= 0 && P.paused && P === local);   // the big Play button over a stopped / paused picture
  }
  function rowEl(cls, name, tag, onclick) {
    const el = document.createElement('div');
    el.className = 'row ' + cls;
    const n = document.createElement('span'), t = document.createElement('span');
    n.className = 'name'; n.textContent = name; t.className = 'tag'; t.textContent = tag || '';
    el.append(n, t); el.onclick = onclick;
    return el;
  }
  function draw() {
    $('#browse').classList.toggle('on', view === 'browse');
    $('#play').classList.toggle('on', view === 'play');
    $('#head').style.display = $('#foot').style.display = view === 'play' ? 'none' : '';
    if (view === 'browse') {
      $('#head').textContent = '/' + cwd;
      const l = $('#blist'); l.innerHTML = '';
      rows.forEach((r, i) => {
        const el = rowEl((r.dir || r.up ? 'dir ' : '') + (i === sel ? 'sel' : ''), r.up ? '..' : r.dir ? r.name + '/' : r.name, '', () => { sel = i; draw(); activate(); });
        if (r.dir) {   // play the folder with all its subfolders
          const b = document.createElement('button');
          b.className = 'pbtn'; b.title = T('Play folder'); b.innerHTML = ICON.play;
          b.onclick = e => { e.stopPropagation(); sel = i; playRow(r); };
          el.appendChild(b);
        }
        l.appendChild(el);
      });
      if (!rows.length) l.textContent = T('(empty)');
      const c = l.children[sel]; if (c && c.scrollIntoView) c.scrollIntoView({block: 'nearest'});
      $('#foot').textContent = '↑↓ select  A open / play  B back';
    } else {
      $('#title').textContent = qi < 0 ? T('Nothing playing') : stem(base(queue[qi]));
      $('#sub').textContent = qi < 0 ? '' : '/' + dirOf(queue[qi]) + '  ·  ' + (qi + 1) + ' / ' + queue.length + '  ·  ' + T(ORDERS[order]) +
        (P === remote ? '  ·  ' + T(!disp.connected ? 'external screen unplugged' : disp.top !== 'videoplayer' ? 'on hold behind another app' : 'on the external screen') : '');
      v.style.visibility = P === remote ? 'hidden' : 'visible';   // the picture is on the other screen
      $('#border').innerHTML = ICON.order[order];
      $('#border').classList.toggle('on', order !== 0);
      $('#border').title = T(ORDERS[order]);
      for (const id of ['#bprev', '#brew', '#bplay', '#bstop', '#bffw', '#bnext']) $(id).classList.toggle('dis', qi < 0);
      showControls();
    }
    drawTime();
  }

  // ---- actions --------------------------------------------------------------------------------
  const pathOf = r => join(cwd, r.name);
  async function playRow(r) {
    if (busy) return; busy = true;
    try {
      if (r.dir) startQueue(await collect(pathOf(r), true));
      else {
        const all = await collect(cwd, false), at = Math.max(0, all.indexOf(pathOf(r)));
        startQueue(all, at);
      }
      if (qi >= 0) { view = 'play'; draw(); }
    } catch (e) { say(e.message); }
    busy = false;
  }
  function activate() {
    const r = rows[sel]; if (!r) return;
    if (r.up) return up();
    if (r.dir) { cwd = pathOf(r); sel = 0; return loadRows(); }
    playRow(r);
  }
  function up() {
    if (!cwd) return Platform.exit();
    const name = base(cwd); cwd = dirOf(cwd);
    loadRows().then(() => { const i = rows.findIndex(r => r.name === name); sel = i < 0 ? 0 : i; draw(); });
  }

  // ---- keys -----------------------------------------------------------------------------------
  addEventListener('keydown', e => {
    const k = e.key;
    if (view === 'browse') {
      if (k === 'ArrowUp') sel = Math.max(0, sel - 1);
      else if (k === 'ArrowDown') sel = Math.min(rows.length - 1, sel + 1);
      else if (k === 'Enter') { e.preventDefault(); return activate(); }
      else if (k === 'Escape') { e.preventDefault(); return up(); }
      else return;
      e.preventDefault(); draw();
    } else {
      // any of A / B / X / Y / the cursor shows the controls over the picture; with the controls hidden that press only
      // shows them, with the controls up the key does its job (X and Y only show them: they have no job here)
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter', 'Escape', ' ', 'Tab'].includes(k)) return;
      e.preventDefault();
      const hidden = ovl.classList.contains('off');
      showControls();
      if (hidden) return;
      if (k === 'ArrowLeft') seek(-10);
      else if (k === 'ArrowRight') seek(10);
      else if (k === 'ArrowUp') prev();
      else if (k === 'ArrowDown') next(false);
      else if (k === 'Enter') toggle();
      else if (k === 'Escape') leave();
    }
  });

  // ---- the external screen: the picture goes there, this page is the remote ----------------------------------------------------------------------
  // useRemote: what plays now (the place and whether it plays) goes to the big page, which tells us it is ready and gets the video then.
  function useRemote() {
    if (P === remote) return;
    const t = local.currentTime || 0, playing = !local.paused;
    if (qi >= 0) local.clear();
    P = remote; remote.t = t; remote.d = NaN; remote.p = !playing;
    draw();
  }
  // useLocal: the picture comes back to this screen at the place it has reached (closeBig: this page takes the big page off the screen; false when it is gone already)
  async function useLocal(closeBig, t, playing) {
    if (P !== remote) return;
    if (t === undefined) { t = remote.t; playing = !remote.p; }
    P = local;
    if (closeBig) { try { await Platform.display.close(); } catch (e) {} }
    if (qi >= 0) local.load(Platform.files.videoUrl(queue[qi]), t, playing);
    draw();
  }
  // goBig: the picture goes to the monitor at this place (the big page asks for the video when it is ready: "ready" below)
  function goBig(t, playing) {
    if (qi >= 0 && P === local) local.clear();
    P = remote; remote.t = t || 0; remote.d = NaN; remote.p = !playing;
    draw();
    if (wantsBig()) sendBig({cmd: 'src', url: Platform.files.videoUrl(queue[qi]), time: remote.t, play: !remote.p});   // its page is there already
    else Platform.display.open({}).catch(e => { say(e.message); useLocal(false, t, playing); });
  }
  Platform.display.on(e => {
    disp = {connected: e.connected, stack: e.stack || [], top: e.top};
    // the owner's rule: with an external monitor the picture is on it. Plugged in while a video is up: it goes there; pulled out: it comes back here
    if (e.event === 'connected' && P === local && qi >= 0) { goBig(local.currentTime || 0, !local.paused); return; }
    if (e.event === 'disconnected' && P === remote) { useLocal(true); return; }
    if (wantsBig() && P === local && qi >= 0) useRemote();             // the big page was opened by somebody else (Caroline) while a video was up here
    else if (!wantsBig() && P === remote) useLocal(false);              // ... or taken off the screen by somebody else
    else draw();
  });
  Platform.display.onMessage(m => {
    if (!m || P !== remote) return;
    if (m.ev === 'time') {
      const was = remote.p;
      remote.t = m.t; remote.d = m.d > 0 ? m.d : NaN; remote.p = !!m.p;
      if (!remote.p) fails = 0;
      drawTime();
      if (was !== remote.p) { showControls(); saveState(true); } else saveState(false);
    } else if (m.ev === 'ended') onEnded();
    else if (m.ev === 'error') onVideoError();
    else if (m.ev === 'ready') {
      if (m.hasSrc) { remote.t = m.t || 0; remote.p = m.p !== false; drawTime(); }   // it came back from under another app with its place
      else if (qi >= 0) sendBig({cmd: 'src', url: Platform.files.videoUrl(queue[qi]), time: remote.t, play: !remote.p});
    }
  });

  // the transport buttons: a tap does the action, rewind / fast forward also scan while held
  $('#big').innerHTML = ICON.play; $('#big').onclick = e => { e.stopPropagation(); toggle(); };
  $('#bprev').innerHTML = ICON.prev; $('#bnext').innerHTML = ICON.next; $('#bstop').innerHTML = ICON.stop;
  $('#brew').innerHTML = ICON.rew; $('#bffw').innerHTML = ICON.ffw;
  $('#bprev').onclick = prev; $('#bnext').onclick = () => next(false); $('#bplay').onclick = toggle; $('#bstop').onclick = stop;
  $('#border').onclick = () => { order = (order + 1) % ORDERS.length; draw(); say(T(ORDERS[order])); saveState(true); };
  function scanButton(el, dir) {
    let t = null, iv = null, held = false;
    const end = () => { clearTimeout(t); clearInterval(iv); t = iv = null; el.classList.remove('hold'); };
    el.addEventListener('pointerdown', () => {
      held = false;
      t = setTimeout(() => { held = true; el.classList.add('hold'); iv = setInterval(() => { seek(dir * 4); showControls(); }, 150); }, 400);
    });
    el.addEventListener('pointerup', () => { if (t === null) return; const was = held; end(); if (!was) seek(dir * 10); });
    el.addEventListener('pointerleave', end); el.addEventListener('pointercancel', end);
  }
  scanButton($('#brew'), -1); scanButton($('#bffw'), 1);

  // touch: tap the bar to seek; tap the picture to show / hide the controls
  $('#bar').addEventListener('click', e => {
    if (!isFinite(P.duration)) return;
    const r = e.currentTarget.getBoundingClientRect();
    P.currentTime = P.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  });
  $('#play').addEventListener('pointerdown', () => { if (!ovl.classList.contains('off')) showControls(); });
  $('#play').addEventListener('click', e => {
    if (ovl.classList.contains('off')) showControls();
    else if (e.target === ovl || e.target === v) { clearTimeout(hideTimer); ovl.classList.add('off'); }
  });
  // drag to scroll the list with the touchscreen
  for (const l of document.querySelectorAll('.list')) {
    let d = null, dragged = false;
    l.addEventListener('pointerdown', e => { d = {y: e.clientY, st: l.scrollTop}; dragged = false; });
    l.addEventListener('pointermove', e => { if (!d) return; const dy = e.clientY - d.y; if (!dragged && Math.abs(dy) > 8) { dragged = true; l.setPointerCapture(e.pointerId); } if (dragged) l.scrollTop = d.st - dy; });
    l.addEventListener('pointerup', () => { d = null; }); l.addEventListener('pointercancel', () => { d = null; });
    l.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  }

  (async () => {
    try { const d = await Platform.display.status(); disp = {connected: d.connected, stack: d.stack || [], top: d.top}; } catch (e) {}
    const arg = await Platform.launchArg().catch(() => null);   // started by the file manager with a file
    let st = null;   // where the last run stopped
    try { st = await Platform.state.get(); if (!st) st = JSON.parse(await Platform.db.get('state')); } catch (e) {}   // the older key, once
    if (st && st.order >= 0 && st.order < ORDERS.length) order = st.order;
    if (arg && arg.open) {
      const p = arg.open;
      cwd = dirOf(p);
      try {
        const same = st && Array.isArray(st.queue) && st.queue[st.qi] === p;   // the video that was playing: go on from the saved time
        const all = await collect(cwd, false); startQueue(all, Math.max(0, all.indexOf(p)), same ? st.time : 0, true);
        if (qi >= 0) view = 'play';
      } catch (e) { say(e.message); }
    } else if (st) {
      if (typeof st.cwd === 'string' && st.cwd) { try { await entries(st.cwd); cwd = st.cwd; } catch (e) {} }
      if (Array.isArray(st.queue) && st.queue.length && st.qi >= 0 && st.qi < st.queue.length) {
        startQueue(st.queue, st.qi, st.time, true);
        view = 'play';
      }
    }
    await loadRows();
  })();
  // Caroline's tools for this page (manifest: "caroline"): what plays, and the transport
  const nowPlaying = () => qi < 0 ? 'Nothing is playing.' : (P.paused ? 'Paused' : 'Playing') + ': ' + queue[qi] + ' (' + fmt(P.currentTime) + ' of ' + fmt(P.duration) + '), video ' + (qi + 1) + ' of ' + queue.length + ', order: ' + ORDERS[order];
  const settled = () => new Promise(r => setTimeout(r, 1200));
  Platform.tools.handle('now_playing', async () => nowPlaying());
  Platform.tools.handle('play', async args => {
    const p = String(args.path || '').replace(/^\/+/, '');
    let list, at = 0, isDir = false;
    try { await entries(p); isDir = true; } catch (e) { /* a file */ }
    if (isDir) list = await collect(p, true);
    else { list = await collect(dirOf(p), false); at = Math.max(0, list.indexOf(p)); }
    if (!list.length) throw new Error('no videos at ' + p);
    startQueue(list, at); view = 'play'; draw();
    await settled();
    return P.paused ? 'Queued, but the picture did not start (' + nowPlaying() + ')' : nowPlaying();
  });
  Platform.tools.handle('pause', async () => { P.pause(); return nowPlaying(); });
  Platform.tools.handle('resume', async () => { if (qi >= 0) await P.play().catch(() => {}); await settled(); return nowPlaying(); });
  Platform.tools.handle('next', async () => { next(false); await settled(); return nowPlaying(); });
  Platform.tools.handle('previous', async () => { prev(); await settled(); return nowPlaying(); });
  Platform.tools.handle('stop', async () => { stop(); return nowPlaying(); });
  Platform.tools.handle('seek', async args => { seek(Number(args.seconds) || 0); return nowPlaying(); });

</script>
