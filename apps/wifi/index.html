<meta charset="utf-8">
<title>Wi-Fi</title>
<meta name="viewport" content="width=640,height=480">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #head { flex: none; height: 40px; line-height: 40px; padding: 0 14px; background: #000; color: #f2a900; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; }
  #st { color: #aaa; font-size: 16px; font-weight: normal; }
  #list { flex: 1; min-height: 0; overflow: auto; touch-action: none; }
  .row { height: 54px; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 21px; }
  .row.sel { background: #f2a900; color: #000; }
  .row .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { font-size: 14px; opacity: .75; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .bars i { display: block; width: 5px; background: currentColor; opacity: .25; }
  .bars i.on { opacity: 1; }
  svg.lock { width: 18px; height: 18px; }
  #msg { flex: none; min-height: 26px; padding: 0 14px 4px; font-size: 16px; color: #ff6b6b; }
  /* password screen */
  #pw { position: fixed; inset: 0; background: #1a1a1a; display: none; flex-direction: column; padding: 14px 18px; gap: 10px; }
  #pw h2 { margin: 0; font-size: 22px; color: #f2a900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pwbox { position: relative; flex: none; }
  #pwin { width: 100%; height: 54px; border: 0; padding: 0 64px 0 14px; font: 22px "DejaVu Sans", sans-serif; background: #fff; color: #000; outline: 0; }
  #eye { position: absolute; right: 0; top: 0; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; color: #555; }
  #eye.sel { outline: 5px solid #fff; outline-offset: -5px; background: #00A2ED; color: #fff; }
  #pwmsg { min-height: 24px; font-size: 16px; color: #ff6b6b; }
</style>
<div id="head"><span>Wi-Fi</span><span id="st"></span></div>
<div id="list"></div>
<div id="msg"></div>
<div id="pw">
  <h2 id="pwtitle"></h2>
  <div class="pwbox">
    <input id="pwin" type="password" placeholder="Password" autocomplete="off">
    <div id="eye"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M3 3l18 18" style="display:none"/></svg></div>
  </div>
  <div id="pwmsg"></div>
</div>
<script src="/platform.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  // On Android the first row opens Android's own Wi-Fi panel: switching Wi-Fi on or off is not given to an app there
  const ANDROID = /Android/.test(navigator.userAgent), PANEL = {panel: true, ssid: "Android's Wi-Fi settings", signal: 0, secured: false};
  let nets = [], sel = 0, busy = false, inPw = null, onEye = false, firstRun = false;

  function bars(sig) {
    const n = sig >= 75 ? 4 : sig >= 50 ? 3 : sig >= 25 ? 2 : 1;
    return '<div class="bars">' + [8, 12, 16, 20].map((h, i) => `<i class="${i < n ? 'on' : ''}" style="height:${h}px"></i>`).join('') + '</div>';
  }

  function draw() {
    const list = $('#list'); list.innerHTML = '';
    nets.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'row' + (i === sel ? ' sel' : '');
      d.innerHTML = '<span class="name"></span>' + (n.connected ? '<span class="tag">connected</span>' : n.known ? '<span class="tag">saved</span>' : '') + (n.panel ? '' : (n.secured ? LOCK : '') + bars(n.signal));
      d.querySelector('.name').textContent = n.ssid;
      d.onclick = () => { sel = i; choose(); };
      list.appendChild(d);
    });
    if (!nets.length) list.innerHTML = '<div class="row"><span class="name" style="opacity:.6">Scanning for networks…</span></div>';
    const cur = list.children[sel]; if (cur && cur.scrollIntoView) cur.scrollIntoView({block: 'nearest'});
  }

  let scanning = false, dots = 0, statusText = '';
  // the header shows "Scanning…" with moving dots while a scan runs, the connection state otherwise
  setInterval(() => { $('#st').textContent = scanning ? Platform.t('Scanning') + '.'.repeat(dots++ % 4) : statusText; }, 400);

  async function status() {
    try {
      const s = await Platform.net.status();
      statusText = s.online ? (s.ssid ? 'Connected: ' + s.ssid : 'Connected') : 'Not connected';
      if (!scanning) $('#st').textContent = statusText;
      return s;
    } catch (e) { return null; }
  }

  async function refresh() {
    if (busy || inPw) return;
    scanning = true; dots = 0;
    try {
      const keep = (nets[sel] && nets[sel].ssid) || wantSsid;
      nets = await Platform.net.scan();
      if (ANDROID) nets = [PANEL, ...nets];
      const i = nets.findIndex(n => n.ssid === keep); sel = i < 0 ? Math.min(sel, Math.max(0, nets.length - 1)) : i;
      $('#msg').textContent = '';
      draw();
    } catch (e) { if (ANDROID) { nets = [PANEL]; sel = 0; $('#msg').textContent = e.message || ''; draw(); } }
    scanning = false;
    status();
  }

  async function connect(ssid, password) {
    busy = true;
    // the password screen covers the list: the progress has to be shown on whichever one is in front
    const say = (t, err) => { const m = inPw ? $('#pwmsg') : $('#msg'); m.style.color = err ? '#ff6b6b' : '#aaa'; m.textContent = t; };
    say('Connecting to ' + ssid + '…');
    try {
      await Platform.net.connect(ssid, password);
      say('');
      closePw();
      await refresh();
      // before the first login the Wi-Fi app cannot be left with MODE: it closes itself once there is a network
      const a = await (await fetch('/api/auth/status')).json();
      if (!a.logged_in) Platform.exit();
    } catch (e) {
      say(e.message || 'Could not connect', true);
    }
    busy = false;
  }

  function choose() {
    const n = nets[sel]; if (!n || busy) return;
    if (n.panel) { fetch('/api/net/panel', {method: 'POST'}); return; }
    if (n.secured && !n.known) openPw(n); else connect(n.ssid);
  }

  function openPw(n) {
    inPw = n; onEye = false; $('#pwtitle').textContent = n.ssid; $('#pwin').value = ''; $('#pwin').type = 'password'; $('#slash').style.display = 'none';
    $('#pwmsg').textContent = ''; $('#pw').style.display = 'flex'; $('#pwin').focus();
  }
  function closePw() { inPw = null; $('#pw').style.display = 'none'; $('#pwin').blur(); }
  function toggleEye() { const p = $('#pwin'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#slash').style.display = show ? '' : 'none'; }

  $('#eye').addEventListener('mousedown', e => e.preventDefault());
  $('#eye').addEventListener('pointerdown', e => e.preventDefault());
  $('#eye').addEventListener('click', toggleEye);
  $('#pwin').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !onEye) { e.preventDefault(); if ($('#pwin').value) connect(inPw.ssid, $('#pwin').value); }
  });

  addEventListener('keydown', e => {
    if (inPw) {   // password screen (while the keyboard is open it owns the keys; Y puts it away)
      if (e.key === 'ArrowRight') onEye = true;
      else if (e.key === 'ArrowLeft') onEye = false;
      else if (e.key === 'Enter' && onEye) toggleEye();
      else if (e.key === 'Escape') closePw();
      else return;
      $('#eye').classList.toggle('sel', onEye); e.preventDefault(); return;
    }
    if (e.key === 'ArrowUp') sel = Math.max(0, sel - 1);
    else if (e.key === 'ArrowDown') sel = Math.min(nets.length - 1, sel + 1);
    else if (e.key === 'Enter') { e.preventDefault(); return choose(); }
    else return;
    e.preventDefault(); draw();
  });

  // drag to scroll the list with the touchscreen
  (() => {
    const l = $('#list'); let d = null, dragged = false;
    l.addEventListener('pointerdown', e => { d = {y: e.clientY, st: l.scrollTop}; dragged = false; });
    l.addEventListener('pointermove', e => { if (!d) return; const dy = e.clientY - d.y; if (!dragged && Math.abs(dy) > 8) { dragged = true; l.setPointerCapture(e.pointerId); } if (dragged) l.scrollTop = d.st - dy; });
    l.addEventListener('pointerup', () => { d = null; }); l.addEventListener('pointercancel', () => { d = null; });
    l.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  })();

  // state: the network that was selected comes back selected (the app shares its window with the others)
  let wantSsid = null;
  Platform.onClose(() => Platform.state.set({ssid: nets[sel] ? nets[sel].ssid : wantSsid}));
  Platform.state.get().then(s => { if (s && s.ssid) wantSsid = s.ssid; }).catch(() => {}).then(() => { draw(); refresh(); setInterval(refresh, 8000); });
  // Caroline's tools for this page (manifest: "caroline"): the connection, the networks around, connecting
  Platform.tools.handle('status', async () => {
    const s = await Platform.net.status();
    return s.online ? 'Connected' + (s.ssid ? ' to ' + s.ssid : '') : 'Not connected';
  });
  Platform.tools.handle('networks', async () => {
    await refresh();
    return nets.filter(n => !n.panel).map(n => n.ssid + ' (signal ' + n.signal + '%' + (n.secured ? ', secured' : ', open') + (n.connected ? ', connected' : n.known ? ', saved' : '') + ')').join('\n') || '(no networks found)';
  });
  Platform.tools.handle('connect', async args => {
    const ssid = String(args.ssid || '');
    const n = nets.find(x => x.ssid === ssid);
    if (!n) throw new Error('"' + ssid + '" is not in the list: call networks first');
    if (n.secured && !n.known && !args.password) throw new Error('"' + ssid + '" is secured and not saved: it needs the password');
    await Platform.net.connect(ssid, args.password || undefined);
    await refresh();
    return (await Platform.net.status()).online ? 'Connected to ' + ssid : 'Could not connect to ' + ssid;
  });

</script>
