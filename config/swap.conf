# The device's swap (runtime/memd.py; sourced by scripts/lib.sh), as on a device: zram, compressed swap in the RAM itself, first;
# the pages of it nobody touched for a while are written back to the eMMC. The kernel of the device has both (ROCKNIX RK3566 config:
# CONFIG_ZRAM, CONFIG_ZRAM_WRITEBACK, lz4); the simulator builds the same zram module for WSL (scripts/zram-module.sh).
# Environment variables of the same name override these.
ZRAM_SIZE="${ZRAM_SIZE:-1024M}"                       # what zram holds, uncompressed: half of the RAM; the RAM it takes is that compressed
ZRAM_ALGO="${ZRAM_ALGO:-lz4}"                         # what ROCKNIX picks for the RK3566: the cheapest on the Cortex-A55
ZRAM_PRIORITY="${ZRAM_PRIORITY:-100}"                 # above any other swap
WRITEBACK_SIZE="${WRITEBACK_SIZE:-1024M}"             # the backing file on the eMMC (0: no writeback)
WRITEBACK_FILE="${WRITEBACK_FILE:-zram-backing.img}"  # in the eMMC's directory (on the simulator EMMC_DIR, config/simulator.env)
WRITEBACK_IDLE_S="${WRITEBACK_IDLE_S:-300}"           # a page not touched for this long goes from the RAM to the eMMC
WRITEBACK_DAILY="${WRITEBACK_DAILY:-512M}"            # the most written to the eMMC a day (its wear)
