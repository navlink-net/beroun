# IntelliCat Simulator: nested Weston (wayland backend) running desktop-shell.
# NOTE: in Weston 14 shell=desktop loads desktop-shell.so (kiosk-shell would be shell=kiosk).
# Resolution is also passed on the command line by start.sh.
[core]
shell=desktop
xwayland=true
idle-time=0

[shell]
locking=false
panel-position=bottom
background-color=0xff101820
clock-format=none

[output]
name=WL1
mode=640x480

[keyboard]
keymap_layout=us

# Weston's own on-screen keyboard is replaced by the HTML one (web-shell/osk.js); start.sh substitutes @NO_IM@
# with a placeholder that only sleeps, so weston-keyboard never pops up over it.
[input-method]
path=@NO_IM@

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/weston-flower
