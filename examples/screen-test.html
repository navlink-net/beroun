<meta charset="utf-8">
<title>Screen test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font: 14px monospace; }
  /* 1px red frame on the very edge: all four sides must be visible if the window is exactly the screen */
  #frame { position: fixed; inset: 0; border: 2px solid #f33; box-sizing: border-box; }
  #grid { position: fixed; inset: 0;
    background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px);
    background-size: 80px 80px; }
  .c { position: fixed; width: 40px; height: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; color: #000; }
  #tl { left: 0; top: 0; background: #f33; } #tr { right: 0; top: 0; background: #3f3; }
  #bl { left: 0; bottom: 0; background: #39f; } #br { right: 0; bottom: 0; background: #ff3; }
  #info { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; background: #000a; padding: 12px 20px; border: 1px solid #888; }
  #big { font-size: 28px; }
</style>
<div id="grid"></div><div id="frame"></div>
<div class="c" id="tl">TL</div><div class="c" id="tr">TR</div><div class="c" id="bl">BL</div><div class="c" id="br">BR</div>
<div id="info"><div id="big"></div><div>expected 640 x 480</div><div id="verdict"></div></div>
<script>
  function update() {
    const w = innerWidth, h = innerHeight, ok = w === 640 && h === 480;
    document.getElementById("big").textContent = w + " x " + h;
    const v = document.getElementById("verdict");
    v.textContent = ok ? "OK: window = screen" : "MISMATCH";
    v.style.color = ok ? "#3f3" : "#f33";
  }
  addEventListener("resize", update); update();
</script>
