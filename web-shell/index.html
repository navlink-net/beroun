<!--
  IntelliCat home screen / launcher: Metro-style tile grid under a thin status bar.
  Tile look, palette and "grid always fills the screen" idea come from CATalogue's
  ondevice/public-launcher/index.html (reimplemented here for the 640x480 console).
  Input: D-pad (arrow keys) + A (Enter), and the touchscreen (tap to launch, drag to scroll).
  Moving an app: a long press and a drag, or SELECT, the D-pad and SELECT again; MODE takes it back.
  The notification panel: R1, or a long press on the status bar.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IntelliCat</title>
<meta name="viewport" content="width=640,height=480">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
               font-family: "DejaVu Sans", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }

  /* status bar: notifications on the left (the larger part), battery + clock on the right */
  #bar { flex: none; height: 40px; background: #000; display: flex; align-items: center;
         padding: 0 12px; gap: 12px; border-bottom: 1px solid #222; }
  #notes { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; }
  #ntext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  #ntext.old { color: #777; }
  #ntext .app { color: #f2a900; margin-right: 6px; }
  #ncount { flex: none; background: #f2a900; color: #000; border-radius: 9px; padding: 0 7px; font-size: 12px;
            font-weight: bold; line-height: 18px; display: none; }
  #batt { flex: none; font-size: 14px; color: #aaa; }
  #clock { flex: none; font-size: 22px; font-weight: bold; letter-spacing: .02em; }

  /* tile grid: fixed 160px cells, scrolls in both directions */
  #grid { flex: 1; min-height: 0; overflow: auto; background: #1a1a1a; }
  #grid::-webkit-scrollbar { display: none; }
  #content { position: relative; }
  .tile, #content .empty { position: absolute; width: var(--cw, 160px); height: var(--ch, 160px); }
  #content .empty { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); pointer-events: none; }
  .tile { border: 0; margin: 0; padding: 8px; font-family: inherit; color: #fff; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
          box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
  .tile.sel, .empty.sel { outline: 5px solid #fff; outline-offset: -5px; }
  .tile.busy { opacity: .55; }
  /* an app being moved: lifted over the grid */
  .tile.lift { z-index: 3; transform: scale(.9); opacity: .92; outline: 5px solid #f2a900; outline-offset: -5px;
               box-shadow: 0 8px 22px rgba(0, 0, 0, .65); pointer-events: none; }
  .tile .glyph { font-size: 64px; line-height: 1; font-weight: bold; }
  .tile img { width: 72px; height: 72px; object-fit: contain; pointer-events: none; }
  /* "more beyond this edge": a small arrow over the grid (dots looked like a handle to drag); a tap on it scrolls one cell that way */
  .more { position: fixed; display: none; align-items: center; justify-content: center; z-index: 5; cursor: pointer;
          background: rgba(0, 0, 0, .55); color: #fff; font-size: 26px; font-weight: bold; line-height: 1; touch-action: none; user-select: none; }
  #moreR { right: 0; top: calc(40px + (100vh - 40px) / 2 - 22px); width: 30px; height: 44px; border-radius: 8px 0 0 8px; }
  #moreD { bottom: 0; left: calc(50% - 22px); width: 44px; height: 30px; border-radius: 8px 8px 0 0; }
  /* first-start login: Kocour on the left, the form (tabs Sign in / Sign up) as flat colored blocks in the launcher's own style on the right */
  #login { flex: 1; min-height: 0; background: radial-gradient(360px 360px at 19% 62%, #2a2410, #1a1a1a 72%); display: none; flex-direction: row; }
  #login .lart { flex: none; width: 228px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px; }
  #login .lart img { height: 270px; max-height: calc(100% - 8px); width: auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,.5));
                     animation: cwbob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  #login .lform { flex: 1; min-width: 0; overflow: auto; padding: 14px 18px 14px 0; display: flex; flex-direction: column; gap: 10px; }
  #login .lform > * { flex: none; }
  #ltabs { display: flex; height: 46px; }
  #ltabs .ltab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #999; border-bottom: 3px solid #444; cursor: pointer; }
  #ltabs .ltab.on { color: #f2a900; font-weight: bold; border-bottom-color: #f2a900; }
  #login #ltabs.sel { outline: 0; }
  #ltabs.sel .ltab.on { outline: 5px solid #fff; outline-offset: -5px; }
  /* first start: the language comes first */
  #langscr { flex: 1; min-height: 0; background: #1a1a1a; display: none; flex-direction: column; }
  #langscr h2 { margin: 0; flex: none; padding: 10px 18px 6px; color: #f2a900; font-size: 22px; }
  #langlist { flex: 1; min-height: 0; overflow: auto; touch-action: none; }
  #langlist .lrow { height: 50px; line-height: 50px; padding: 0 18px; font-size: 21px; border-bottom: 1px solid #242c34; }
  #langlist .lrow.sel { background: #f2a900; color: #000; }
  #gate { flex: 1; background: #1a1a1a; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #aaa; font-size: 20px; }
  #gate h2 { margin: 0; color: #f2a900; font-size: 26px; }
  /* after a login, while Caroline starts and her start wizard is still to come: the launcher waits here (the wizard then takes the window) */
  #cwait { flex: 1; min-height: 0; background: radial-gradient(520px 340px at 50% 0%, #2a2410, #1a1a1a 70%); display: none; flex-direction: column; align-items: center;
           justify-content: center; gap: 10px; padding: 0 40px; text-align: center; }
  #cwait .pic { height: 190px; display: flex; align-items: flex-end; justify-content: center; }
  #cwait .pic img { height: 190px; width: auto; animation: cwbob 2.6s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,.5)); }
  #cwait .pic svg { width: 110px; height: 110px; animation: cwglow 2.4s ease-in-out infinite; }
  @keyframes cwbob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-8px) rotate(1.2deg); } }
  @keyframes cwglow { 50% { opacity: .65; transform: scale(.95); } }
  #cwait h2 { margin: 4px 0 0; color: #f2a900; font-size: 26px; }
  #cwait .sub { color: #bbb; font-size: 17px; line-height: 1.35; }
  #cwait .cbar { width: 100%; height: 12px; border-radius: 6px; background: #333; overflow: hidden; margin-top: 6px; }
  #cwait .cfill { height: 100%; width: 3%; border-radius: 6px; background: linear-gradient(90deg, #c8651b, #f2a900); transition: width .5s; }
  #cwait .cmeta { width: 100%; display: flex; justify-content: space-between; color: #999; font-size: 15px; }
  #login input, #login .go { height: 54px; border: 0; border-radius: 0; font: 22px "DejaVu Sans", sans-serif; padding: 0 14px; }
  #login input { background: #fff; color: #000; width: 100%; outline: 0; }
  #login .go { background: #00A2ED; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #login .sel { outline: 5px solid #fff; outline-offset: -5px; }
  .pw { position: relative; }
  .pw input { padding-right: 64px; }
  #leye { position: absolute; right: 0; top: 0; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; color: #555; cursor: pointer; }
  #leye.sel { outline: 5px solid #fff; outline-offset: -5px; background: #00A2ED; color: #fff; }
  #lerr { min-height: 24px; color: #ff6b6b; font-size: 16px; }
  #notes { cursor: pointer; }
  #dnd { flex: none; display: none; background: #444; color: #fff; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: bold; line-height: 18px; }
  /* the notification panel: opened by a long press on the bar or R1, replaces the tile grid */
  #panel { flex: 1; min-height: 0; background: #1a1a1a; display: none; flex-direction: column; }
  #panel h2 { margin: 0; flex: none; padding: 8px 18px 4px; color: #f2a900; font-size: 22px; }
  #plist { flex: 1; min-height: 0; overflow: auto; touch-action: none; }
  #plist .prow { min-height: 50px; padding: 6px 12px 6px 18px; font-size: 18px; border-bottom: 1px solid #242c34; display: flex; align-items: center; gap: 10px; }
  #plist .prow.sel { background: #f2a900; color: #000; }
  #plist .prow .ptext { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #plist .prow .papp { color: #f2a900; margin-right: 6px; }
  #plist .prow.sel .papp { color: #000; font-weight: bold; }
  #plist .prow.err .ptext { color: #ff8080; }
  #plist .prow.sel.err .ptext { color: #7a0000; }
  #plist .prow .pat { flex: none; font-size: 14px; opacity: .7; }
  #plist .prow .px { flex: none; width: 36px; height: 36px; border: 3px solid currentColor; border-radius: 8px; text-align: center; line-height: 30px; font-size: 22px; }
  #plist .prow.item.unread { border-left: 5px solid #f2a900; padding-left: 13px; }
  #plist .empty { padding: 20px 18px; color: #777; font-size: 18px; }
  #bar.flash { animation: flash .4s steps(2) 3; }
  @keyframes flash { 50% { background: #f2a900; } }
  #ntext.err { color: #ff6b6b; }
  .tile { overflow: hidden; }
  .tile .badge { position: absolute; top: 6px; right: 6px; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 15px; box-sizing: border-box;
                 background: #fff; color: #000; font-size: 18px; font-weight: bold; line-height: 30px; text-align: center; }
  .tile .label { font-size: 17px; line-height: 1.2; text-align: center; width: 100%;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar">
  <div id="notes"><span id="ntext" class="old">IntelliCat</span><span id="ncount"></span></div>
  <div id="dnd">DND</div>
  <div id="batt"></div>
  <div id="clock">--:--</div>
</div>
<div id="login">
  <div class="lart"><img src="/kocour.webp" alt="Kocour, the IntelliCat mascot"></div>
  <div class="lform">
    <div id="ltabs"><div class="ltab on" data-m="in">Sign in</div><div class="ltab" data-m="up">Sign up</div></div>
    <input id="lemail" type="email" placeholder="Email" autocomplete="off">
    <div class="pw">
      <input id="lpass" type="password" placeholder="Password" autocomplete="off">
      <div id="leye"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path id="lslash" d="M3 3l18 18" style="display:none"/></svg></div>
    </div>
    <input id="lpass2" type="password" placeholder="Repeat password" autocomplete="off" style="display:none">
    <div class="go" id="lgo">Sign in</div>
    <div id="lerr"></div>
  </div>
</div>
<div id="langscr"><h2>Language</h2><div id="langlist"></div></div>
<div id="gate"><h2>No network</h2><div id="gwait">Opening Wi-Fi</div></div>
<div id="cwait">
  <div class="pic" id="cwpic"></div>
  <h2 id="cwtitle">Caroline is getting ready</h2>
  <div class="sub" id="cwsub">Your assistant is starting. Her setup comes next.</div>
  <div class="cbar"><div class="cfill" id="cwfill"></div></div>
  <div class="cmeta"><span id="cwphase">Starting</span><span id="cwpct">3%</span></div>
</div>
<div id="panel"><h2>Notifications</h2><div id="plist"></div></div>
<div id="grid"><div id="content"></div></div>
<div class="more" id="moreR">&#x25B8;</div>
<div class="more" id="moreD">&#x25BE;</div>
<script src="/i18n.js"></script>
<script src="/osk-bundle.js"></script>
<script src="/focusframe.js"></script>
<script src="/recovery.js"></script>
<script>
let CW = 160, CH = 160;   // a cell: 160 x 160 on the console; on a screen of another shape (a phone) it is stretched, see fitCells()
const MIN_COLS = 4, MIN_ROWS = 3;
const PALETTE = ['#00A2ED', '#2D7D9A', '#60A917', '#A4C400', '#F0A30A', '#E51400', '#9F00A7',
                 '#008A00', '#6A00FF', '#1BA1E2', '#D80073', '#A20025', '#647687', '#3A3A3A'];
const $ = s => document.querySelector(s);
const api = (p, body) => fetch('/api' + p, body ? {method: 'POST', body: JSON.stringify(body)} : {}).then(r => r.json());

// input diagnostics (what this page really receives) -> shelld input.log
const plog = m => fetch('/api/log', {method: 'POST', body: JSON.stringify({msg: 'launcher ' + m})}).catch(() => {});
addEventListener('keydown', e => plog('keydown key=' + e.key + ' code=' + e.code), true);
addEventListener('pointerdown', e => plog('pointerdown ' + e.clientX + ',' + e.clientY + ' type=' + e.pointerType), true);
addEventListener('click', e => plog('click ' + e.clientX + ',' + e.clientY), true);

function hash(s) { let h = 0; for (const c of s) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0; return Math.abs(h); }
function textColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b < 140 ? '#fff' : '#000';
}

// the cursor is on a cell of the grid, a tile or an empty one: cur = {c, r}; cells holds the grid's elements row by row, tiles the apps' tiles.
// Where each app stands is the user's: an app is moved by a long press and a drag, or by SELECT, the D-pad and SELECT again (MODE takes it
// back); the places are kept in the launcher's store as {app id: [column, row]}, and an app that has no place yet takes the first free cell.
const LONG = 500;   // ms: a long press
let apps = [], places = {}, at = {}, cols = MIN_COLS, rows = MIN_ROWS, gc = MIN_COLS + 1, gr = MIN_ROWS + 1, cells = [], tiles = [],
    cur = {c: 0, r: 0}, moving = null, locked = false, loginActive = false;   // moving: {i, from: {c, r}, touch} while an app is carried
const appAt = (c, r) => at[c + ',' + r] ?? -1;

// cols x rows is the apps' area: up to the rightmost and the lowest app, at least the screen. The grid adds one free column on the right
// and one free row at the bottom (room to move an app to), so it is never smaller than 5 x 4
function layout() {
  const n = apps.length, wide = Math.max(MIN_COLS, Math.ceil(Math.sqrt(n * 1.3))), pos = [];
  at = {};
  apps.forEach((a, i) => {
    const p = places[a.id];
    if (Array.isArray(p) && p.length === 2 && p.every(v => Number.isInteger(v) && v >= 0 && v < 100) && !((p[0] + ',' + p[1]) in at)) {
      pos[i] = {c: p[0], r: p[1]}; at[p[0] + ',' + p[1]] = i;
    }
  });
  let k = 0;
  apps.forEach((a, i) => {
    if (pos[i]) return;
    while ((k % wide + ',' + Math.floor(k / wide)) in at) k++;
    pos[i] = {c: k % wide, r: Math.floor(k / wide)}; at[pos[i].c + ',' + pos[i].r] = i;
  });
  cols = Math.max(MIN_COLS, ...pos.map(p => p.c + 1));
  rows = Math.max(MIN_ROWS, ...pos.map(p => p.r + 1));
  return pos;
}

// On a screen that is not the console's 640x480 (a phone) the cells are stretched so that whole tiles fill the grid, 160 px each give or take: no cut tile, no empty strip
function fitCells() {
  const g = $('#grid'), w = g.clientWidth, h = g.clientHeight;
  let cw = 160, ch = 160;
  if (w > 0 && h > 0 && !(innerWidth === 640 && innerHeight === 480)) { cw = w / Math.max(3, Math.round(w / 160)); ch = h / Math.max(2, Math.round(h / 160)); }
  if (cw === CW && ch === CH) return false;
  CW = cw; CH = ch;
  document.documentElement.style.setProperty('--cw', cw + 'px'); document.documentElement.style.setProperty('--ch', ch + 'px');
  return true;
}
function refit() { if (fitCells() && apps.length) render(); }
addEventListener('resize', refit);

function render() {
  fitCells();
  const n = apps.length, pos = layout();
  gc = cols + 1; gr = rows + 1;
  cur = {c: Math.min(cur.c, gc - 1), r: Math.min(cur.r, gr - 1)};
  const content = $('#content');
  content.style.width = gc * CW + 'px';
  content.style.height = gr * CH + 'px';
  content.innerHTML = ''; cells = []; tiles = [];
  for (let j = 0; j < gc * gr; j++) {
    const c = j % gc, r = Math.floor(j / gc), left = c * CW + 'px', top = r * CH + 'px';
    const i = appAt(c, r), on = c === cur.c && r === cur.r ? ' sel' : '';
    if (i >= 0 && !(moving && moving.i === i)) {   // the carried app leaves an empty cell behind
      const a = apps[i], color = PALETTE[hash(a.id) % PALETTE.length];
      const t = document.createElement('button');
      t.className = 'tile' + on;
      t.style.cssText = `left:${left};top:${top};background:${color};color:${textColor(color)}`;
      if (a.icon) { const im = document.createElement('img'); im.src = a.icon; t.appendChild(im); }
      else { const g = document.createElement('span'); g.className = 'glyph'; g.textContent = a.name.trim().charAt(0).toUpperCase(); t.appendChild(g); }
      const l = document.createElement('span'); l.className = 'label'; l.textContent = a.name; t.appendChild(l);
      if (a.badge) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = a.badge > 99 ? '99+' : a.badge; t.appendChild(b); }
      t.onclick = () => { if (moving) return; select(c, r); launch(i); };
      content.appendChild(t); cells.push(t); tiles[i] = t;
    } else {
      const e = document.createElement('div');
      e.className = 'empty' + on;
      e.style.cssText = `left:${left};top:${top};background:${PALETTE[hash(j + ',' + gc) % PALETTE.length]}`;
      content.appendChild(e); cells.push(e);
    }
  }
  if (moving) {   // the carried app is drawn over the grid, at the cursor (the D-pad) or under the finger
    const a = apps[moving.i], color = PALETTE[hash(a.id) % PALETTE.length], t = document.createElement('div');
    t.className = 'tile lift';
    t.style.cssText = `left:${cur.c * CW}px;top:${cur.r * CH}px;background:${color};color:${textColor(color)}`;
    if (a.icon) { const im = document.createElement('img'); im.src = a.icon; t.appendChild(im); }
    else { const g = document.createElement('span'); g.className = 'glyph'; g.textContent = a.name.trim().charAt(0).toUpperCase(); t.appendChild(g); }
    const l = document.createElement('span'); l.className = 'label'; l.textContent = a.name; t.appendChild(l);
    content.appendChild(t); tiles[moving.i] = t;
  }
  more();
  return pos;
}

// the marks at the right and bottom edges: shown while the grid goes on beyond that edge; a tap scrolls one cell that way
function more() {
  const g = $('#grid'), on = g.clientWidth > 0 && g.clientHeight > 0;
  $('#moreR').style.display = on && g.scrollLeft + g.clientWidth < g.scrollWidth - 1 ? 'flex' : 'none';
  $('#moreD').style.display = on && g.scrollTop + g.clientHeight < g.scrollHeight - 1 ? 'flex' : 'none';
}
$('#grid').addEventListener('scroll', more);
addEventListener('resize', more);
new ResizeObserver(() => { more(); refit(); }).observe($('#grid'));   // the grid is hidden and shown again by the panel, the login and the first start
$('#moreR').addEventListener('click', () => $('#grid').scrollBy({left: CW, behavior: 'smooth'}));
$('#moreD').addEventListener('click', () => $('#grid').scrollBy({top: CH, behavior: 'smooth'}));

// the cursor's frame only
function mark(c, r) {
  const old = cells[cur.r * gc + cur.c]; if (old) old.classList.remove('sel');
  cur = {c, r}; try { sessionStorage.setItem('cell', c + ',' + r); } catch (e) {}
  const el = cells[r * gc + c]; if (el) el.classList.add('sel');
}
function select(c, r) {
  mark(c, r);
  if (moving && !moving.touch) { const t = tiles[moving.i]; t.style.left = c * CW + 'px'; t.style.top = r * CH + 'px'; }
  reveal();
}

// scrolls the grid just enough for the cell under the cursor to be whole on the screen
function reveal() {
  const g = $('#grid'), x0 = cur.c * CW, y0 = cur.r * CH;
  let x = g.scrollLeft, y = g.scrollTop;
  if (x0 < x) x = x0; else if (x0 + CW > x + g.clientWidth) x = x0 + CW - g.clientWidth;
  if (y0 < y) y = y0; else if (y0 + CH > y + g.clientHeight) y = y0 + CH - g.clientHeight;
  if (x !== g.scrollLeft || y !== g.scrollTop) g.scrollTo({left: x, top: y, behavior: 'smooth'});
}

// ---- moving an app: pick it up, put it down on a cell (an app that stands there takes the carried app's old place), or take it back --------
function pick(c, r, touch) {
  const i = appAt(c, r);
  if (i < 0 || moving) return false;
  moving = {i, from: {c, r}, touch};
  render(); select(c, r);
  return true;
}
function drop(c, r) {
  if (!moving) return;
  const pos = layout(), {i, from} = moving, other = appAt(c, r);
  places = {};
  apps.forEach((a, k) => { places[a.id] = [pos[k].c, pos[k].r]; });   // every app keeps the place it has now
  places[apps[i].id] = [c, r];
  if (other >= 0 && other !== i) places[apps[other].id] = [from.c, from.r];
  moving = null;
  api('/db/set', {key: 'places', value: JSON.stringify(places)}).catch(() => {});
  render(); select(c, r);
}
function cancelMove() {
  if (!moving) return;
  const {from} = moving;
  moving = null; render(); select(from.c, from.r);
}

async function launch(i) {
  if (locked || !apps[i]) return;
  locked = true;
  const t = tiles[i];
  if (t) t.classList.add('busy');
  try { await api('/launch', {id: apps[i].id}); } catch (e) {}
  setTimeout(() => { locked = false; if (t) t.classList.remove('busy'); }, 1500);
}

// The touchscreen (the simulated touch arrives as pointer events; WPE does not pan on its own). A drag moves the grid in both directions;
// a press that did not move still counts as a tap on the tile; a long press on a tile picks the app up: it follows the finger (the grid
// scrolls when the finger comes near its edge) and goes down on the cell under its middle when the finger is lifted.
(() => {
  const g = $('#grid'), EDGE = 36, STEP = 8;
  let d = null, dragged = false, timer = null, grab = null, fx = 0, fy = 0, auto = 0;
  g.style.touchAction = 'none';

  async function choose() {
    const code = langs[ls].code;
    await fetch('/api/settings/set', {method: 'POST', body: JSON.stringify({key: 'layouts', value: code === 'en' ? ['en'] : ['en', code]})});
    await fetch('/api/settings/set', {method: 'POST', body: JSON.stringify({key: 'language', value: code})});
    location.reload();   // the page comes back in the chosen language and goes on to the network
  }
  addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') ls = Math.max(0, ls - 1);
    else if (e.key === 'ArrowDown') ls = Math.min(langs.length - 1, ls + 1);
    else if (e.key === 'Enter') { e.preventDefault(); choose(); return; }
    else return;
    e.preventDefault(); draw();
  });
  let d = null, dragged = false;
  list.addEventListener('pointerdown', e => { d = {y: e.clientY, st: list.scrollTop}; dragged = false; });
  list.addEventListener('pointermove', e => { if (!d) return; const dy = e.clientY - d.y; if (!dragged && Math.abs(dy) > 8) { dragged = true; list.setPointerCapture(e.pointerId); } if (dragged) list.scrollTop = d.st - dy; });
  list.addEventListener('pointerup', () => { d = null; }); list.addEventListener('pointercancel', () => { d = null; });
  list.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  draw();
}

// First start: the login needs the network. Without one the Wi-Fi app takes the shared window (this page is replaced; the app cannot be
// left with MODE); when it closes itself after connecting, the launcher loads again and finds the network, and the login screen is what stays.
let gating = false;
async function gateNetwork() {
  gating = true; $('#grid').style.display = 'none'; $('#gate').style.display = 'flex';
  let dots = 0;
  const anim = setInterval(() => { $('#gwait').textContent = I18N.t('Opening Wi-Fi') + '.'.repeat(dots++ % 4); }, 400);
  for (;;) {
    const n = await api('/net/status');
    if (n.online) break;
    try { await api('/launch', {id: 'wifi'}); } catch (e) {}   // already in the window: nothing happens
    await new Promise(r => setTimeout(r, 1500));
  }
  clearInterval(anim);
  gating = false; $('#gate').style.display = 'none';
  showLogin();
}
</script>
